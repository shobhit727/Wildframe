# Wildframe CI/CD Pipeline
#
# CI: lint -> test -> security -> build smoke.
# CD: build immutable images -> deploy to Kubernetes with Helm -> verify rollouts.
#
# Supply-chain hardening (audit #393/#392/#496/#405/#235/#638):
# - All third-party actions are pinned to immutable commit SHAs (tags in comments).
# - Top-level permissions default to contents:read; jobs override explicitly.
# - Dependency vulnerability scan fails CI on CRITICAL/HIGH findings.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  POETRY_VERSION: "2.4.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVICES: >-
    api-gateway auth-service user-service content-service streaming-service
    search-service recommendation-service billing-service analytics-service
    notification-service media-pipeline creators-service moderation-service
    uploads-service admin-service

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: python -m pip install "ruff==0.11.10" "black==26.5.1"

      - name: Run ruff check
        run: ruff check services/

      - name: Run black --check
        run: black --check services/

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Run mypy per service
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            echo "::group::mypy $svc"
            (
              cd "services/$svc"
              poetry install --no-interaction --with dev
              poetry run mypy app
            )
            echo "::endgroup::"
          done
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint infrastructure/helm/wildframe

      - name: Reject placeholder image registries
        run: |
          set -euo pipefail
          # Fail if any tracked k8s manifest or helm values/template references
          # a placeholder registry (issue #341).
          if grep -RInE 'registry\.example\.com|example\.com/.+:latest' \
              infrastructure/kubernetes infrastructure/helm 2>/dev/null; then
            echo "ERROR: placeholder image registry reference found (issue #341)"
            exit 1
          fi

      - name: Enforce committed Chart.lock (dependency drift check)
        run: |
          set -euo pipefail
          # Helm charts must pin dependencies in a committed Chart.lock.
          # Regenerate and fail on any diff (issue #514).
          if [ ! -f infrastructure/helm/wildframe/Chart.lock ] && \
             grep -q '^dependencies:' infrastructure/helm/wildframe/Chart.yaml; then
            echo "ERROR: Chart.lock missing for chart with dependencies (issue #514)"
            exit 1
          fi
          if grep -q '^dependencies:' infrastructure/helm/wildframe/Chart.yaml; then
            helm dependency update infrastructure/helm/wildframe
            git diff --exit-code -- infrastructure/helm/wildframe/Chart.lock \
              || { echo "ERROR: Chart.lock drifted from Chart.yaml (issue #514)"; exit 1; }
          fi

      - name: Render default manifests
        run: helm template wildframe infrastructure/helm/wildframe --namespace wildframe > /tmp/helm-out.yaml

      - name: Validate every service is rendered
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            grep -q "name: $svc" /tmp/helm-out.yaml || { echo "missing service: $svc"; exit 1; }
          done

      - name: Validate staging values
        run: helm template wildframe infrastructure/helm/wildframe -f infrastructure/helm/values-staging.yaml --namespace wildframe-staging > /tmp/helm-staging.yaml

      - name: Validate production values
        run: helm template wildframe infrastructure/helm/wildframe -f infrastructure/helm/values-production.yaml --namespace wildframe-production > /tmp/helm-production.yaml

  backend-test:
    name: Backend Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
          - creators-service
          - moderation-service
          - uploads-service
          - search-service
          - analytics-service
          - billing-service
          - recommendation-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache service virtualenv
        id: poetry-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: services/${{ matrix.service }}/.venv
          key: venv-v3-${{ env.PYTHON_VERSION }}-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/poetry.lock', matrix.service), format('services/{0}/pyproject.toml', matrix.service)) }}
          restore-keys: |
            venv-${{ env.PYTHON_VERSION }}-${{ runner.os }}-${{ matrix.service }}-

      - name: Install service dependencies
        # Always install: the venv cache is a speed hint, not a correctness
        # dependency — a stale/poisoned cache must never skip dependency setup.
        working-directory: services/${{ matrix.service }}
        run: poetry install --no-interaction --with dev

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD:${PYTHONPATH:-}" poetry run pytest tests --asyncio-mode=auto -q --cov=app --cov-report=term-missing:skip-covered

      - name: Print slowest tests
        if: always()
        working-directory: services/${{ matrix.service }}
        run: |
          PYTHONPATH="$PWD:${PYTHONPATH:-}" poetry run pytest tests --asyncio-mode=auto --durations=20 -q

  backend-sdk-test:
    name: Backend Test (sdk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --quiet "pytest<8" "pytest-asyncio>=0.21,<0.22" "pytest-cov<5" "fastapi>=0.104" "prometheus-client>=0.18" "httpx>=0.25,<0.28"

      - name: Run SDK tests
        run: |
          PYTHONPATH="$PWD/packages/sdk:${PYTHONPATH:-}" python -m pytest packages/sdk/tests --asyncio-mode=auto -q --cov=packages --cov-report=term-missing:skip-covered

      - name: Print slowest tests
        if: always()
        run: PYTHONPATH="$PWD/packages/sdk:${PYTHONPATH:-}" python -m pytest packages/sdk/tests --asyncio-mode=auto --durations=20 -q

  backend-route-contract:
    name: Frontend/backend route contract (#44)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: python -m pip install --quiet "pytest<8" "pytest-cov<5"

      - name: Detect frontend/backend route drift
        run: python -m pytest tests/contract -q

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker-build-smoke:
    name: Docker Build Smoke (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
          - creators-service
          - moderation-service
          - uploads-service
          - search-service
          - analytics-service
          - billing-service
          - recommendation-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.service }}:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend-smoke:
    name: Docker Build Smoke (frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: wildframe-web:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-files: apps/web/certificates/localhost-key.pem
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit

  build-images:
    name: Build & Push (${{ matrix.service }})
    needs: [backend-lint, backend-test, backend-sdk-test, helm-lint, security-scan, docker-build-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
          - creators-service
          - moderation-service
          - uploads-service
          - search-service
          - analytics-service
          - billing-service
          - recommendation-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - name: Build and push immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    needs: [frontend-ci, docker-build-frontend-smoke, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web-app
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    needs: [build-images, build-frontend]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name wildframe-staging --region us-east-1
      - name: Authenticate Kubernetes to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace wildframe-staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n wildframe-staging create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy with Helm
        run: |
          helm upgrade --install wildframe-staging infrastructure/helm/wildframe \
            -f infrastructure/helm/values-staging.yaml \
            --namespace wildframe-staging \
            --create-namespace \
            --set-string image.tag="sha-${GITHUB_SHA}" \
            --set-string imagePullSecrets[0].name=ghcr-pull \
            --atomic --timeout 10m
      - name: Verify all deployments
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            kubectl rollout status "deployment/$svc" -n wildframe-staging --timeout=5m
          done
      - name: Verify service health endpoints
        run: |
          set -euo pipefail
          kubectl -n wildframe-staging run wildframe-smoke --rm --restart=Never \
            --image=curlimages/curl:8.16.0 -- \
            sh -ec 'for svc in api-gateway auth-service user-service content-service streaming-service admin-service media-pipeline creators-service moderation-service uploads-service search-service analytics-service billing-service recommendation-service notification-service; do curl --fail --silent --show-error --max-time 10 "http://$svc/health" >/dev/null; done'

  deploy-production:
    name: Deploy Production
    needs: [build-images, build-frontend]
    # Skips unless a deployment target is configured: the AWS IAM role to
    # assume must be provided as a repo variable. Without it (e.g. on forks
    # or infra-less environments) the pipeline stays green.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name wildframe-production --region us-east-1
      - name: Authenticate Kubernetes to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace wildframe-production --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n wildframe-production create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy with Helm
        run: |
          helm upgrade --install wildframe-prod infrastructure/helm/wildframe \
            -f infrastructure/helm/values-production.yaml \
            --namespace wildframe-production \
            --create-namespace \
            --set-string image.tag="sha-${GITHUB_SHA}" \
            --set-string imagePullSecrets[0].name=ghcr-pull \
            --atomic --timeout 15m
      - name: Verify all deployments
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            kubectl rollout status "deployment/$svc" -n wildframe-production --timeout=10m
          done
      - name: Verify service health endpoints
        run: |
          set -euo pipefail
          kubectl -n wildframe-production run wildframe-smoke --rm --restart=Never \
            --image=curlimages/curl:8.16.0 -- \
            sh -ec 'for svc in api-gateway auth-service user-service content-service streaming-service admin-service media-pipeline creators-service moderation-service uploads-service search-service analytics-service billing-service recommendation-service notification-service; do curl --fail --silent --show-error --max-time 10 "http://$svc/health" >/dev/null; done'
      - name: Deployment summary
        run: |
          echo "Production deployment verified for commit $GITHUB_SHA"
          kubectl get deployments -n wildframe-production
