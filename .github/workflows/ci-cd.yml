# Wildframe CI/CD Pipeline
#
# Consolidated pipeline: lint → test → build-smoke → deploy.
# Runs on push/PR to main and develop.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  POETRY_VERSION: "1.8.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Backend lint: ruff, black, mypy over services/
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: python -m pip install ruff black mypy

      - name: Run ruff check
        run: ruff check services/

      - name: Run black --check
        run: black --check services/

      - name: Run mypy
        run: mypy services/
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Backend tests: pytest + coverage per service
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
          - creators-service
          - moderation-service
          - uploads-service
          - search
          - analytics
          - billing
          - recommendation
          - notification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/.venv
          key: venv-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/pyproject.toml', matrix.service)) }}

      - name: Install service dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: services/${{ matrix.service }}
        run: poetry install --no-interaction --with dev

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" \
            poetry run pytest tests \
              --asyncio-mode=auto -q \
              --cov=app --cov-report=term-missing:skip-covered

      - name: Print slowest tests
        if: always()
        working-directory: services/${{ matrix.service }}
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" \
            poetry run pytest tests \
              --asyncio-mode=auto --durations=20 -q

  # ---------------------------------------------------------------------------
  # Frontend CI: lint + build for apps/web
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check apps/web exists
        id: check
        run: |
          if [ -d "apps/web" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test -- --run
        continue-on-error: true

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker build smoke: build (no push) representative services
  # ---------------------------------------------------------------------------
  docker-build-smoke:
    name: Docker Build Smoke (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - content-service
          - streaming-service
          - media-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.service }}:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security scanning (non-blocking)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit

  # ===========================================================================
  # CD JOBS — only run on push to main/develop, skip if secrets not configured
  # ===========================================================================

  # Build and push Docker images
  build-images:
    name: Build & Push ${{ matrix.service }}
    needs: [backend-lint, backend-test, docker-build-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and push frontend image
  build-frontend:
    name: Build & Push Frontend
    needs: [frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web-app
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging (develop branch)
  deploy-staging:
    name: Deploy Staging
    needs: [build-images, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update EKS kubeconfig
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws eks update-kubeconfig --name wildframe-staging --region us-east-1

      - name: Deploy with Helm
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          helm repo add wildframe https://charts.wildframe.com || true
          helm repo update
          helm upgrade --install wildframe-staging wildframe/wildframe \
            -f infrastructure/helm/values-staging.yaml \
            --namespace wildframe-staging \
            --create-namespace

      - name: Verify deployment
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl rollout status deployment/api-gateway -n wildframe-staging --timeout=5m || true
          kubectl rollout status deployment/auth-service -n wildframe-staging --timeout=5m || true

      - name: Run smoke tests
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          chmod +x scripts/smoke-tests.sh || true
          ./scripts/smoke-tests.sh staging || true

  # Deploy to production (main branch)
  deploy-production:
    name: Deploy Production
    needs: [build-images, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update EKS kubeconfig
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws eks update-kubeconfig --name wildframe-production --region us-east-1

      - name: Create deployment approval
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployment to production is ready. Waiting for approval.'
            })

      - name: Deploy with Helm (Blue-Green)
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          helm repo add wildframe https://charts.wildframe.com || true
          helm repo update
          helm upgrade --install wildframe-prod wildframe/wildframe \
            -f infrastructure/helm/values-production.yaml \
            --namespace wildframe-production \
            --create-namespace \
            --atomic \
            --timeout 10m

      - name: Verify deployment
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl rollout status deployment/api-gateway -n wildframe-production --timeout=10m || true
          kubectl rollout status deployment/auth-service -n wildframe-production --timeout=10m || true
          kubectl rollout status deployment/user-service -n wildframe-production --timeout=10m || true

      - name: Run smoke tests
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          chmod +x scripts/smoke-tests.sh || true
          ./scripts/smoke-tests.sh production || true

      - name: Notify deployment
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Wildframe deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*\nVersion: ${{ github.sha }}\nRef: ${{ github.ref }}"
                  }
                }
              ]
            }