# Wildframe CI/CD Pipeline
#
# Consolidated pipeline: lint → test → build-smoke → deploy.
# Runs on push/PR to main and develop.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  POETRY_VERSION: "1.8.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Backend lint: ruff, black, mypy over services/
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: python -m pip install "ruff==0.11.10" black mypy

      - name: Run ruff check
        run: ruff check services/

      - name: Run black --check
        run: black --check services/

      - name: Run mypy
        run: |
          for app_dir in services/*/app; do
            mypy "$app_dir"
          done
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Helm chart lint/render: validates infrastructure/helm/wildframe
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint infrastructure/helm/wildframe

      - name: Render manifests
        run: helm template wildframe infrastructure/helm/wildframe --namespace wildframe > /tmp/helm-out.yaml

      - name: Check all services rendered
        run: |
          for svc in api-gateway auth-service user-service content-service streaming-service \
                      search-service recommendation-service billing-service analytics-service \
                      notification-service media-pipeline creators-service moderation-service \
                      uploads-service admin-service; do
            grep -q "name: $svc" /tmp/helm-out.yaml || { echo "missing service: $svc"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # Backend tests: pytest + coverage per service
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
          - creators-service
          - moderation-service
          - uploads-service
          - search-service
          - analytics-service
          - billing-service
          - recommendation-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/.venv
          key: venv-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services/{0}/pyproject.toml', matrix.service)) }}

      - name: Install service dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: services/${{ matrix.service }}
        run: poetry install --no-interaction --with dev

      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" \
            poetry run pytest tests \
              --asyncio-mode=auto -q \
              --cov=app --cov-report=term-missing:skip-covered

      - name: Print slowest tests
        if: always()
        working-directory: services/${{ matrix.service }}
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" \
            poetry run pytest tests \
              --asyncio-mode=auto --durations=20 -q

  # ---------------------------------------------------------------------------
  # Backend SDK tests: shared event + observability packages (packages/sdk)
  # ---------------------------------------------------------------------------
  backend-sdk-test:
    name: Backend Test (sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --quiet \
            "pytest<8" "pytest-asyncio>=0.21,<0.22" "pytest-cov<5" \
            "fastapi>=0.104" "prometheus-client>=0.18" "httpx>=0.25"

      - name: Run SDK tests
        run: |
          PYTHONPATH="$PWD/packages/sdk:$PYTHONPATH" \
            python -m pytest packages/sdk/tests \
              --asyncio-mode=auto -q \
              --cov=packages --cov-report=term-missing:skip-covered

      - name: Print slowest tests
        if: always()
        run: |
          PYTHONPATH="$PWD/packages/sdk:$PYTHONPATH" \
            python -m pytest packages/sdk/tests \
              --asyncio-mode=auto --durations=20 -q

  # ---------------------------------------------------------------------------
  # Frontend CI: lint + type-check + test + build for apps/web
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --run
        continue-on-error: true

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker build smoke: build (no push) representative services
  # ---------------------------------------------------------------------------
  docker-build-smoke:
    name: Docker Build Smoke (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - content-service
          - streaming-service
          - media-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.service }}:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security scanning (non-blocking)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit

  # ===========================================================================
  # CD JOBS — only run on push to main/develop
  # ===========================================================================

  # Build and push Docker images
  build-images:
    name: Build & Push ${{ matrix.service }}
    needs: [backend-lint, backend-test, docker-build-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - content-service
          - streaming-service
          - admin-service
          - media-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and push frontend image
  build-frontend:
    name: Build & Push Frontend
    needs: [frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web-app
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging (develop branch)
  deploy-staging:
    name: Deploy Staging
    needs: [build-images, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update EKS kubeconfig
        run: |
          aws eks update-kubeconfig --name wildframe-staging --region us-east-1

      - name: Deploy with Helm
        run: |
          helm upgrade --install wildframe-staging infrastructure/helm/wildframe \
            -f infrastructure/helm/values-staging.yaml \
            --namespace wildframe-staging \
            --create-namespace \
            --atomic

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n wildframe-staging --timeout=5m || true
          kubectl rollout status deployment/auth-service -n wildframe-staging --timeout=5m || true

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-tests.sh || true
          ./scripts/smoke-tests.sh staging || true

  # Deploy to production (main branch)
  deploy-production:
    name: Deploy Production
    needs: [build-images, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update EKS kubeconfig
        run: |
          aws eks update-kubeconfig --name wildframe-production --region us-east-1

      - name: Create deployment approval comment
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            if (prs.length > 0) {
              await github.rest.issues.createComment({
                issue_number: prs[0].number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 Production deployment for commit \`${sha}\` is ready. Waiting for approval.`,
              });
            }

      - name: Deploy with Helm (Blue-Green)
        run: |
          helm upgrade --install wildframe-prod infrastructure/helm/wildframe \
            -f infrastructure/helm/values-production.yaml \
            --namespace wildframe-production \
            --create-namespace \
            --atomic \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n wildframe-production --timeout=10m || true
          kubectl rollout status deployment/auth-service -n wildframe-production --timeout=10m || true
          kubectl rollout status deployment/user-service -n wildframe-production --timeout=10m || true

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-tests.sh || true
          ./scripts/smoke-tests.sh production || true

      - name: Notify deployment
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Wildframe deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status*\nVersion: ${{ github.sha }}\nRef: ${{ github.ref }}"
                  }
                }
              ]
            }