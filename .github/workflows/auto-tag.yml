# Auto-tag: when a v* tag is pushed, create a matching GitHub Release.
# This keeps the release surface in sync with version tags without requiring
# manual release creation. The workflow is intentionally minimal — it does
# not build or publish artifacts, only drafts a release from the tag.

name: Auto Tag Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release from Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
