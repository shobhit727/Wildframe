# Nightly live-stack integration suite (#1119).
#
# Pull requests run only the Compose smoke (ci-cd.yml `compose-smoke`). Pushes
# to main/develop and workflow_dispatch run the smoke plus tests/integration
# there. This workflow adds a nightly run of that same smoke-plus-suite path
# without scheduling all of ci-cd.yml, which would run every job nightly. It
# calls the same scripts with the same hook as the push path:
# scripts/compose-smoke.sh with COMPOSE_SMOKE_POST_PASS=scripts/ci-integration-suite.sh.
#
# Schedule: 03:17 UTC daily. That is off-peak for GitHub-hosted runners, and the
# minute is deliberately off the hour, when scheduled runs are most often delayed.
#
# Actions are pinned to the same commit SHAs as ci-cd.yml (Supply Chain Guard #809).

name: Integration (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-nightly-${{ github.ref }}
  # A manual dispatch must not kill a nightly run halfway through a 29-container
  # stack; the second run waits instead.
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  integration:
    name: Compose stack + integration suite (nightly)
    runs-on: ubuntu-latest
    # Same budget as the push path in ci-cd.yml `compose-smoke`: build 14m32s
    # measured, health wait <=7m, bootstrap + probes ~2m, suite <=30m
    # (INTEGRATION_TIMEOUT_SECONDS), teardown ~2m.
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the integration suite's dependencies
        run: python -m pip install --quiet "pytest<8" "httpx>=0.25,<0.29"

      # Not continue-on-error: no pull request waits on this workflow, so a
      # failure here is simply a red nightly run, and that red run is the signal.
      - name: Run Compose runtime smoke and the integration suite
        timeout-minutes: 60
        env:
          COMPOSE_PROJECT_NAME: wildframe-nightly-${{ github.run_id }}
          COMPOSE_SMOKE_POST_PASS: scripts/ci-integration-suite.sh
          PYTHON: python
        run: bash scripts/compose-smoke.sh

      - name: Summarise the run
        if: always()
        run: |
          set -uo pipefail
          log_file="${RUNNER_TEMP}/wildframe-compose-smoke.log"
          {
            echo "## Integration (nightly)"
            echo ""
            echo '```'
            grep -o -e 'COMPOSE_SMOKE_RESULT=[A-Z]*' -e 'COMPOSE_SMOKE_POST_PASS_RESULT=[A-Z]*' \
              -e '\[integration\] .*' -e 'INTEGRATION_SUITE_RESULT=[A-Z_]*' "$log_file" 2>/dev/null \
              || echo "no markers: the smoke script did not get far enough to write any (see the artifact)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-nightly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wildframe-compose-smoke.log
            ${{ runner.temp }}/wildframe-compose-config.json
            ${{ runner.temp }}/wildframe-compose-ps.json
            ${{ runner.temp }}/wildframe-integration-junit.xml
          if-no-files-found: warn
          retention-days: 7
