# Dependabot configuration — automated dependency + security updates.
# github-actions updates keep SHA-pinned workflow actions (see ci-cd.yml) current;
# pip/npm cover runtime dependencies. Security updates for these ecosystems are
# enabled by GitHub automatically; intervals/labels/limits set here.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "setuptools"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Dev-only browser toolkit: playwright is pinned to match the local
  # browser cache; do not open bump PRs for it.
  - package-ecosystem: "npm"
    directory: "/scripts/dev"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "playwright"
    labels:
      - "dependencies"
      - "javascript"