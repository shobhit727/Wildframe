# Development compose: postgres/redis/kafka here are DEV-ONLY (ephemeral,
# in-cluster equivalents). Production Helm (infrastructure/helm) requires
# managed external RDS/ElastiCache and fails closed if external postgres/redis
# not configured (see templates/validate-external.yaml and values-production.yaml).
# Backup/PITR for production is via Terraform RDS backupRetention 30d, KMS
# encryption, multi-AZ, and ElastiCache multi-AZ with slow-log.

# Dev TLS certificates: never committed. Generate before up:
#   bash scripts/generate-dev-certs.sh   # creates apps/web/certificates/*.pem (SANs localhost,127.0.0.1,::1,192.168.1.14, perms 644)
services:
  # Compose overrides every backend listener to Uvicorn's port 8000.
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wildframe_db
      POSTGRES_USER: wildframe
      POSTGRES_PASSWORD: wildframe_dev_password
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../infrastructure/database/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U wildframe
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
    - 6379:6379
    command: redis-server --appendonly yes
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  kafka:
    restart: unless-stopped
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:29092,SASL_SSL_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:29092,SASL_SSL_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_SUPER_USERS: User:admin;User:kafka
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # All broker credentials live in ONE static JAAS section, generated at
      # container start by ./kafka-entrypoint.sh from the variables below. Do not
      # reintroduce KAFKA_LISTENER_NAME_*_SASL_JAAS_CONFIG here: cp-kafka's
      # configure lowercases every KAFKA_* variable, so
      # KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG becomes
      # `listener.name.sasl.ssl.plain.sasl.jaas.config` and can never match the
      # listener actually named `SASL_SSL` (Kafka matches listener names
      # case-sensitively). Verified against a running broker: with only that
      # property set, a client authenticating as `admin` succeeded while all 15
      # service users were rejected, because every listener credential was
      # silently falling back to the static section anyway.
      #
      # The variable NAMES and the ${VAR:-default} expressions below are the same
      # ones each service uses in its own block, so the broker and the services
      # cannot drift: a .env override moves both sides at once. Every password
      # has a dev-only default for the same reason KAFKA_INTER_BROKER_PASSWORD
      # and KAFKA_ADMIN_PASSWORD do -- an unset variable interpolates to the
      # empty string, and a broker holding empty passwords can never
      # authenticate anybody. A real .env value always wins.
      #
      # These are deliberately NOT KAFKA_-prefixed: cp-kafka would translate them
      # into unknown broker properties (it already did so for
      # inter.broker.user/admin.password, which are not Kafka configs).
      WF_INTER_BROKER_USER: ${KAFKA_INTER_BROKER_USER:-kafka}
      WF_INTER_BROKER_PASSWORD: ${KAFKA_INTER_BROKER_PASSWORD:-wildframe-dev}
      WF_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-wildframe-dev}
      API_GATEWAY_KAFKA_USERNAME: ${API_GATEWAY_KAFKA_USERNAME:-api-gateway}
      API_GATEWAY_KAFKA_PASSWORD: ${API_GATEWAY_KAFKA_PASSWORD:-wildframe-dev}
      AUTH_SERVICE_KAFKA_USERNAME: ${AUTH_SERVICE_KAFKA_USERNAME:-auth-service}
      AUTH_SERVICE_KAFKA_PASSWORD: ${AUTH_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      USER_SERVICE_KAFKA_USERNAME: ${USER_SERVICE_KAFKA_USERNAME:-user-service}
      USER_SERVICE_KAFKA_PASSWORD: ${USER_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      CONTENT_SERVICE_KAFKA_USERNAME: ${CONTENT_SERVICE_KAFKA_USERNAME:-content-service}
      CONTENT_SERVICE_KAFKA_PASSWORD: ${CONTENT_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      STREAMING_SERVICE_KAFKA_USERNAME: ${STREAMING_SERVICE_KAFKA_USERNAME:-streaming-service}
      STREAMING_SERVICE_KAFKA_PASSWORD: ${STREAMING_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      SEARCH_SERVICE_KAFKA_USERNAME: ${SEARCH_SERVICE_KAFKA_USERNAME:-search-service}
      SEARCH_SERVICE_KAFKA_PASSWORD: ${SEARCH_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      RECOMMENDATION_SERVICE_KAFKA_USERNAME: ${RECOMMENDATION_SERVICE_KAFKA_USERNAME:-recommendation-service}
      RECOMMENDATION_SERVICE_KAFKA_PASSWORD: ${RECOMMENDATION_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      BILLING_SERVICE_KAFKA_USERNAME: ${BILLING_SERVICE_KAFKA_USERNAME:-billing-service}
      BILLING_SERVICE_KAFKA_PASSWORD: ${BILLING_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      ANALYTICS_SERVICE_KAFKA_USERNAME: ${ANALYTICS_SERVICE_KAFKA_USERNAME:-analytics-service}
      ANALYTICS_SERVICE_KAFKA_PASSWORD: ${ANALYTICS_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      NOTIFICATION_SERVICE_KAFKA_USERNAME: ${NOTIFICATION_SERVICE_KAFKA_USERNAME:-notification-service}
      NOTIFICATION_SERVICE_KAFKA_PASSWORD: ${NOTIFICATION_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      CREATORS_SERVICE_KAFKA_USERNAME: ${CREATORS_SERVICE_KAFKA_USERNAME:-creators-service}
      CREATORS_SERVICE_KAFKA_PASSWORD: ${CREATORS_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      MODERATION_SERVICE_KAFKA_USERNAME: ${MODERATION_SERVICE_KAFKA_USERNAME:-moderation-service}
      MODERATION_SERVICE_KAFKA_PASSWORD: ${MODERATION_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      UPLOADS_SERVICE_KAFKA_USERNAME: ${UPLOADS_SERVICE_KAFKA_USERNAME:-uploads-service}
      UPLOADS_SERVICE_KAFKA_PASSWORD: ${UPLOADS_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      MEDIA_PIPELINE_KAFKA_USERNAME: ${MEDIA_PIPELINE_KAFKA_USERNAME:-media-pipeline}
      MEDIA_PIPELINE_KAFKA_PASSWORD: ${MEDIA_PIPELINE_KAFKA_PASSWORD:-wildframe-dev}
      ADMIN_SERVICE_KAFKA_USERNAME: ${ADMIN_SERVICE_KAFKA_USERNAME:-admin-service}
      ADMIN_SERVICE_KAFKA_PASSWORD: ${ADMIN_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      # A PEM keystore must be the private key AND certificate concatenated in one
      # file; localhost.pem is the certificate only, so it cannot serve as a
      # keystore. scripts/generate-dev-certs.sh emits both bundles below.
      # cp-kafka's entrypoint (etc/confluent/docker/configure) derives
      # KAFKA_SSL_KEYSTORE_LOCATION from *_FILENAME and hard-fails without it, so
      # the FILENAME vars are what actually select the generated bundles.
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-keystore.pem
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-keystore.pem
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-truststore.pem
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka-truststore.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      # The entrypoint reads the key/keystore passwords from these two files.
      # cp-kafka requires both vars: KAFKA_SSL_KEY_CREDENTIALS supplies
      # ssl.key.password, KAFKA_SSL_KEYSTORE_CREDENTIALS supplies
      # ssl.keystore.credentials. scripts/generate-dev-certs.sh writes them.
      KAFKA_SSL_KEY_CREDENTIALS: kafka_key_password
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka_keystore_password
      # ONLY the key password is allowed with a PEM keystore. Kafka validates
      # this in SslEngineFactory and refuses to start with
      #   SSL key store password cannot be specified with PEM format,
      #   only key password may be specified
      # (thrown from the broker-to-controller channel, so it kills the broker the
      # same way the missing JAAS section did). So KAFKA_SSL_KEYSTORE_PASSWORD
      # and KAFKA_SSL_TRUSTSTORE_PASSWORD are deliberately NOT set: leaving them
      # unset is what keeps the PEM keystore valid, and an unset variable here
      # simply omits the property rather than emitting an empty one. The
      # keystore password is still available to the broker through
      # ssl.keystore.credentials above if a future keystore type needs it.
      # deployments/kafka-client.properties follows the same rule.
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEY_PASSWORD:-wildframe-dev}
      # cp-kafka's entrypoint hard-fails with `dub ensure KAFKA_OPTS` whenever
      # ADVERTISED_LISTENERS contains a SASL_ endpoint, so this must be non-empty.
      # Heap settings plus the one system property the broker cannot do without.
      #
      # -Djava.security.auth.login.config points at /etc/kafka/kafka-server-jaas.conf,
      # which kafka-entrypoint.sh generates from KAFKA_INTER_BROKER_USER /
      # KAFKA_INTER_BROKER_PASSWORD / KAFKA_ADMIN_PASSWORD immediately before the
      # broker launches. It is REQUIRED: the broker-to-controller channel
      # (BrokerToControllerChannelManagerImpl) looks its credentials up in the
      # static JAAS configuration named "KafkaServer" and ignores the
      # listener-scoped KAFKA_LISTENER_NAME_*_SASL_JAAS_CONFIG settings, so
      # without this property the broker crash-loops at startup with
      #   Could not find a 'KafkaServer' or 'sasl_ssl.KafkaServer' entry in the
      #   JAAS configuration. System property 'java.security.auth.login.config'
      #   is not set
      #
      # That property is JVM-global, which is why it used to be a trap: every JVM
      # in the container inherits it, and cp-kafka's preflight `cub zk-ready`
      # then tries to SASL to the dev ZooKeeper, which has no SASL, and exits 1
      # (verified: "ERROR ... Authentication failed", exit 1). The escape hatch
      # is ZOOKEEPER_SASL_ENABLED=false below, NOT removing the property:
      # cub only forwards KAFKA_OPTS to its own JVM when ZooKeeper SASL is
      # enabled, so with that set the preflight stays plaintext -- which is
      # correct, because this stack's ZooKeeper genuinely has no SASL.
      KAFKA_OPTS: -Xms256M -Xmx512M -Djava.security.auth.login.config=/etc/kafka/kafka-server-jaas.conf
      # Read by confluent-docker-utils' cub (see note above). Deliberately NOT
      # KAFKA_-prefixed: a KAFKA_* var would be translated into a broker property.
      # The dev ZooKeeper is plaintext; saying so is what keeps the preflight JVM
      # from inheriting the broker's SASL login config.
      ZOOKEEPER_SASL_ENABLED: "false"
    ports:
    - 9092:9092
    - 29092:29092
    volumes:
    - kafka_data:/var/lib/kafka/data
    # Dev TLS certificates are generated locally via scripts/generate-dev-certs.sh (never committed, issue #788).
    # Mount the directory so Caddy/Grafana/Kafka all see the same generated pair.
    - ../apps/web/certificates:/etc/kafka/secrets:ro
    # SASL_SSL credentials for the broker healthcheck (see deployments/kafka-client.properties).
    - ./kafka-client.properties:/etc/kafka/kafka-client.properties:ro
    # Generates /etc/kafka/kafka-server-jaas.conf from the environment before the
    # broker starts; see the script header for why the static JAAS section is
    # required and why it is not committed.
    - ./kafka-entrypoint.sh:/opt/wildframe/kafka-entrypoint.sh:ro
    entrypoint:
    - /bin/bash
    - /opt/wildframe/kafka-entrypoint.sh
    healthcheck:
      # localhost:29092 is the SASL_SSL listener, so this CLI must authenticate or
      # it can never succeed and every service blocked on
      # `depends_on: kafka: condition: service_healthy` deadlocks. The
      # --command-config file supplies sasl.mechanism/PLAIN + the admin
      # credentials + the dev truststore; the file is mounted read-only just
      # above. The client context is taken from sasl.jaas.config in that file, so
      # the broker's global login config (KAFKA_OPTS) does not apply to it.
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:29092
      - --command-config
      - /etc/kafka/kafka-client.properties
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks:
    - wildframe-network
  zookeeper:
    restart: unless-stopped
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
    - 127.0.0.1:2181:2181
    volumes:
    - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test:
      # `cub zk-ready <connect_string> <timeout_secs>` takes exactly two
      # positional arguments -- `timeout` is REQUIRED (bare `cub zk-ready
      # localhost:2181` exits 2 with "the following arguments are required:
      # timeout"). The old form passed "localhost 2181", which cub parsed as
      # connect_string=localhost, timeout=2181 SECONDS (sessionTimeout=2181000
      # ms in the output), i.e. a nonsense 36-minute wait, not a 5s one.
      # The 5s healthcheck timeout was below the tool's real floor: it is a JVM,
      # so it spends ~5s on startup before it ever touches ZooKeeper (measured
      # 4.8-6.0s idle, up to ~17s while the broker was crash-looping). That
      # made the container flap healthy -> unhealthy -> restart and killed the
      # broker's ZK session each time. 15s leaves ~2.5x headroom over the
      # observed floor; 10s is the tool-level cap on waiting for ZK.
      #
      # Do NOT "fix" this with `echo ruok | nc localhost 2181`: 4lw.commands.whitelist
      # excludes ruok on ZK 3.6, and nc still exits 0 against a disabled
      # handler, so that check passes without proving anything.
      - CMD-SHELL
      - cub zk-ready localhost:2181 10
      interval: 10s
      timeout: 15s
      retries: 10
    networks:
      - wildframe-network
  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
    - 127.0.0.1:9200:9200
    - 127.0.0.1:9300:9300
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200 | grep -q cluster_name
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    volumes:
    - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    # bearer_token_file for the /metrics guard. Generated + gitignored; the
    # same value reaches the services as METRICS_TOKEN below.
    - ../infrastructure/prometheus/metrics_bearer_token:/etc/prometheus/metrics_bearer_token:ro
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    networks:
    - wildframe-network
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    ports:
    - 127.0.0.1:3001:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/localhost.pem
      GF_SERVER_CERT_KEY: /etc/grafana/certs/localhost-key.pem
      GF_SERVER_ROOT_URL: https://localhost:3001
    volumes:
    - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning
    - grafana_data:/var/lib/grafana
    - ../apps/web/certificates:/etc/grafana/certs:ro
    depends_on:
    - prometheus
    networks:
    - wildframe-network
  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PROXY_X_FOR_COUNT: '1'
      PROXY_X_PROTO_COUNT: '1'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - wildframe-network
  caddy:
    restart: unless-stopped
    image: caddy:2
    ports:
    - 3000:3000
    - 8000:8000
    - 8001:8001
    - 8002:8002
    - 8003:8003
    - 8004:8004
    - 8005:8005
    - 8006:8006
    - 8007:8007
    - 8008:8008
    - 8009:8009
    - 8010:8010
    - 8011:8011
    - 8012:8012
    - 8013:8013
    - 8014:8014
    - 8080:8080
    - 5050:5050
    - 9090:9090
    - 3100:3100
    - 16686:16686
    volumes:
    - ../infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - ../apps/web/certificates:/etc/caddy/certs:ro
    depends_on:
    - api-gateway
    - auth-service
    - user-service
    - content-service
    - streaming-service
    - search-service
    - admin-service
    - recommendation-service
    - billing-service
    - analytics-service
    - notification-service
    - media-pipeline
    - creators-service
    - moderation-service
    - uploads-service
    - pgadmin
    - prometheus
    - loki
    - jaeger
    - web
    networks:
    - wildframe-network
  web:
    restart: unless-stopped
    image: deployments-web:latest
    # apps/web/Dockerfile builds from the repo root (it COPYs the workspace
    # package.json + package-lock.json, apps/web, and packages/), so the context
    # must be `..` exactly like the 15 backend services. Without this key no
    # image was ever produced and `image:` alone could only ever pull/push.
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_APP_NAME=Wildframe
      - NEXT_PUBLIC_APP_URL=https://192.168.1.14:3000
      - NEXT_PUBLIC_API_URL=https://192.168.1.14:8080
    depends_on:
      - api-gateway
    networks:
      - wildframe-network

  loki:
    restart: unless-stopped
    image: grafana/loki:latest
    volumes:
    - ../infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
    - loki_data:/loki
    command:
    - -config.file=/etc/loki/local-config.yaml
    networks:
    - wildframe-network
  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:latest
    ports:
    - 14268:14268
    - 14250:14250
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - jaeger_data:/badger/data
    networks:
    - wildframe-network
  auth-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
      target: development
    environment:
      # Bearer token for the production /metrics guard (#841); matches the
      # file Prometheus reads via bearer_token_file.
      METRICS_TOKEN: ${METRICS_TOKEN:-wildframe-metrics-dev}
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/auth_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      DLQ_RETENTION_MS: '604800000'
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAILS: demo@wildframe.com
      JWT_ALGORITHM: RS256
      JWT_EXPIRATION_MINUTES: 15
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${AUTH_SERVICE_KAFKA_USERNAME:-auth-service}
      KAFKA_SASL_PASSWORD: ${AUTH_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      KAFKA_CLIENT_ID: auth-service
      KAFKA_GROUP_ID: auth-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/auth-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    - ../packages/sdk/wildframe_auth:/app/wildframe_auth
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    healthcheck: &backend-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
    - wildframe-network
  user-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/users_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${USER_SERVICE_KAFKA_USERNAME:-user-service}
      KAFKA_SASL_PASSWORD: ${USER_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      KAFKA_CLIENT_ID: user-service
      KAFKA_GROUP_ID: user-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/user-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
