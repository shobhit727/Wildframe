# Development compose: postgres/redis/kafka here are DEV-ONLY (ephemeral,
# in-cluster equivalents). Production Helm (infrastructure/helm) requires
# managed external RDS/ElastiCache and fails closed if external postgres/redis
# not configured (see templates/validate-external.yaml and values-production.yaml).
# Backup/PITR for production is via Terraform RDS backupRetention 30d, KMS
# encryption, multi-AZ, and ElastiCache multi-AZ with slow-log.

# Dev TLS certificates: never committed. Generate before up:
#   bash scripts/generate-dev-certs.sh   # creates apps/web/certificates/*.pem (SANs localhost,127.0.0.1,::1,192.168.1.14, perms 644)
services:
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wildframe_db
      POSTGRES_USER: wildframe
      POSTGRES_PASSWORD: wildframe_dev_password
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../infrastructure/database/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U wildframe
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
    - 6379:6379
    command: redis-server --appendonly yes
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  kafka:
    restart: unless-stopped
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:29092,SASL_SSL_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:29092,SASL_SSL_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_SUPER_USERS: User:admin;User:kafka
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_INTER_BROKER_USER}" password="${KAFKA_INTER_BROKER_PASSWORD}" user_admin="${KAFKA_ADMIN_PASSWORD}" user_auth-service="${AUTH_SERVICE_KAFKA_PASSWORD}" user_user-service="${USER_SERVICE_KAFKA_PASSWORD}" user_content-service="${CONTENT_SERVICE_KAFKA_PASSWORD}" user_streaming-service="${STREAMING_SERVICE_KAFKA_PASSWORD}" user_search-service="${SEARCH_SERVICE_KAFKA_PASSWORD}" user_recommendation-service="${RECOMMENDATION_SERVICE_KAFKA_PASSWORD}" user_billing-service="${BILLING_SERVICE_KAFKA_PASSWORD}" user_analytics-service="${ANALYTICS_SERVICE_KAFKA_PASSWORD}" user_notification-service="${NOTIFICATION_SERVICE_KAFKA_PASSWORD}" user_creators-service="${CREATORS_SERVICE_KAFKA_PASSWORD}" user_moderation-service="${MODERATION_SERVICE_KAFKA_PASSWORD}" user_uploads-service="${UPLOADS_SERVICE_KAFKA_PASSWORD}" user_media-pipeline="${MEDIA_PIPELINE_KAFKA_PASSWORD}" user_admin-service="${ADMIN_SERVICE_KAFKA_PASSWORD}";'
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/localhost.pem
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/localhost.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEY_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
    ports:
    - 9092:9092
    - 29092:29092
    volumes:
    - kafka_data:/var/lib/kafka/data
    # Dev TLS certificates are generated locally via scripts/generate-dev-certs.sh (never committed, issue #788).
    # Mount the directory so Caddy/Grafana/Kafka all see the same generated pair.
    - ../apps/web/certificates:/etc/kafka/secrets:ro
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:29092
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks:
    - wildframe-network
  zookeeper:
    restart: unless-stopped
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
    - 2181:2181
    volumes:
    - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test:
      - CMD
      - echo
      - ruok
      - '|'
      - nc
      - localhost
      - '2181'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
    - 9200:9200
    - 9300:9300
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200 | grep -q cluster_name
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    volumes:
    - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    networks:
    - wildframe-network
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    ports:
    - 3001:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/localhost.pem
      GF_SERVER_CERT_KEY: /etc/grafana/certs/localhost-key.pem
      GF_SERVER_ROOT_URL: https://localhost:3001
    volumes:
    - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning
    - grafana_data:/var/lib/grafana
    - ../apps/web/certificates:/etc/grafana/certs:ro
    depends_on:
    - prometheus
    networks:
    - wildframe-network
  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PROXY_X_FOR_COUNT: '1'
      PROXY_X_PROTO_COUNT: '1'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - wildframe-network
  caddy:
    restart: unless-stopped
    image: caddy:2
    ports:
    - 8000:8000
    - 8001:8001
    - 8002:8002
    - 8003:8003
    - 8004:8004
    - 8005:8005
    - 8006:8006
    - 8007:8007
    - 8008:8008
    - 8009:8009
    - 8010:8010
    - 8011:8011
    - 8012:8012
    - 8013:8013
    - 8014:8014
    - 8080:8080
    - 5050:5050
    - 9090:9090
    - 3100:3100
    - 16686:16686
    volumes:
    - ../infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - ../apps/web/certificates:/etc/caddy/certs:ro
    depends_on:
    - api-gateway
    - auth-service
    - user-service
    - content-service
    - streaming-service
    - search-service
    - admin-service
    - recommendation-service
    - billing-service
    - analytics-service
    - notification-service
    - media-pipeline
    - creators-service
    - moderation-service
    - uploads-service
    - pgadmin
    - prometheus
    - loki
    - jaeger
    networks:
    - wildframe-network
  web:
    restart: unless-stopped
    image: deployments-web:latest
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_APP_NAME=Wildframe
      - NEXT_PUBLIC_APP_URL=http://192.168.1.14:3000
      - NEXT_PUBLIC_API_URL=http://192.168.1.14:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - wildframe-network

  loki:
    restart: unless-stopped
    image: grafana/loki:latest
    volumes:
    - ../infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
    - loki_data:/loki
    command:
    - -config.file=/etc/loki/local-config.yaml
    networks:
    - wildframe-network
  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:latest
    ports:
    - 14268:14268
    - 14250:14250
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - jaeger_data:/badger/data
    networks:
    - wildframe-network
  auth-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/auth_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      DLQ_RETENTION_MS: '604800000'
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAILS: demo@wildframe.com
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 15
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${AUTH_SERVICE_KAFKA_USERNAME:-auth-service}
      KAFKA_SASL_PASSWORD: ${AUTH_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: auth-service
      KAFKA_GROUP_ID: auth-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/auth-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  user-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/users_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${USER_SERVICE_KAFKA_USERNAME:-user-service}
      KAFKA_SASL_PASSWORD: ${USER_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: user-service
      KAFKA_GROUP_ID: user-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/user-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  admin-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/admin_db
      EVENT_PUBLISHER: kafka
      DLQ_RETENTION_MS: '604800000'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/3
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${ADMIN_SERVICE_KAFKA_USERNAME:-admin-service}
      KAFKA_SASL_PASSWORD: ${ADMIN_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: admin-service
      KAFKA_GROUP_ID: admin-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/admin-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  content-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/content-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/content_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      DLQ_RETENTION_MS: '604800000'
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${CONTENT_SERVICE_KAFKA_USERNAME:-content-service}
      KAFKA_SASL_PASSWORD: ${CONTENT_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: content-service
      KAFKA_GROUP_ID: content-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/content-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  api-gateway:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
      target: development
    environment:
      # Dev-friendly auth burst limit (prod default stays 5/min)
      RATE_LIMIT_AUTH: '60'
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      CONTENT_SERVICE_URL: http://content-service:8000
      REDIS_URL: redis://redis:6379/3
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${API_GATEWAY_KAFKA_USERNAME:-api-gateway}
      KAFKA_SASL_PASSWORD: ${API_GATEWAY_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: api-gateway
      KAFKA_GROUP_ID: api-gateway
      KAFKA_SSL_INSECURE: "true"
    depends_on:
    - auth-service
    - user-service
    - content-service
    - redis
    volumes:
    - ../services/api-gateway:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  streaming-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/streaming-service/Dockerfile
      target: development
    environment:
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/streaming_db
      REDIS_URL: redis://redis:6379/4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${STREAMING_SERVICE_KAFKA_USERNAME:-streaming-service}
      KAFKA_SASL_PASSWORD: ${STREAMING_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: streaming-service
      KAFKA_GROUP_ID: streaming-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ../services/streaming-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  search-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
      target: development
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/5
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/search_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      DLQ_RETENTION_MS: '604800000'
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${SEARCH_SERVICE_KAFKA_USERNAME:-search-service}
      KAFKA_SASL_PASSWORD: ${SEARCH_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: search-service
      KAFKA_GROUP_ID: search-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ../services/search-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
  recommendation-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/recommendation-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/recommendation_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      CONTENT_SERVICE_URL: http://content-service:8000
      REDIS_URL: redis://redis:6379/6
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_PUBLISHER: kafka
      DLQ_RETENTION_MS: '604800000'
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${RECOMMENDATION_SERVICE_KAFKA_USERNAME:-recommendation-service}
      KAFKA_SASL_PASSWORD: ${RECOMMENDATION_SERVICE_KAFKA_PASSWORD}
      KAFKA_CLIENT_ID: recommendation-service
      KAFKA_GROUP_ID: recommendation-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ../services/recommendation-service:/app
