  api-gateway:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
      target: development
    environment:
      # RATE_LIMIT_AUTH is deliberately NOT overridden here. The single source of
      # truth is services/api-gateway/app/core/settings.py (RATE_LIMIT_AUTH), and
      # the dev stack must run the same ceiling the rest of the system documents,
      # otherwise the live-stack suite stops testing the shipped configuration.
      #
      # What the setting actually is (it is NOT a burst limit):
      #   sustained requests per 60s window, per client key, where the client key
      #   is the authenticated JWT `sub`, else the client IP (app/api/gateway_routes.py
      #   -> RateLimiter._check_dual in app/middleware.py). The separate burst
      #   setting is RATE_LIMIT_BURST_AUTH over RATE_LIMIT_BURST_WINDOW seconds.
      #
      # This bucket covers the WHOLE /auth/* namespace, not just /auth/login: the
      # service name is the first path segment, so /auth/me, /auth/refresh,
      # /auth/logout and /auth/step-up all draw on the same budget. The abuse-prone
      # endpoints carry their own finer-grained limits inside auth-service
      # (app/api/routes/auth.py -> app/core/rate_limit.py), so the gateway's job
      # here is a coarse edge ceiling, not per-endpoint abuse control.
      #
      # It is load-bearing for the live-stack suite, which runs against this very
      # stack: tests/integration/conftest.py paces itself to <=3 IP-keyed auth
      # calls per 60s and tests/integration/test_gateway_auth.py asserts the 6th
      # auth request in a window is a 429. Raising this above 5 silently breaks
      # both. If you need a higher dev ceiling, raise the default in settings.py
      # together with that suite, not just here.
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
