services:
  # PostgreSQL - Main Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wildframe_db
      POSTGRES_USER: wildframe
      POSTGRES_PASSWORD: wildframe_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildframe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildframe-network

  # Redis - Caching & Sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildframe-network

  # Kafka - Event Streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildframe-network

  # Zookeeper - Kafka Coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildframe-network

  # Elasticsearch - Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q cluster_name"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildframe-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - wildframe-network

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - wildframe-network

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - wildframe-network

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector HTTP
      - "14250:14250"  # Collector gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
      - jaeger_data:/badger/data
    networks:
      - wildframe-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      target: development
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET_KEY: dev-secret-key-do-not-use-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 15
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --reload"
    networks:
      - wildframe-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
      target: development
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/users_db
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/user-service:/app
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --reload"
    networks:
      - wildframe-network

  # Admin Service
  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
      target: development
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/admin_db
      REDIS_URL: redis://redis:6379/3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/admin-service:/app
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --reload"
    networks:
      - wildframe-network

  # Content Service
  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
      target: development
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/content_db
      REDIS_URL: redis://redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/content-service:/app
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --reload"
    networks:
      - wildframe-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      CONTENT_SERVICE_URL: http://content-service:8000
      REDIS_URL: redis://redis:6379/3
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
    depends_on:
      - auth-service
      - user-service
      - content-service
      - redis
    volumes:
      - ./services/api-gateway:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Streaming Service
  streaming-service:
    build:
      context: .
      dockerfile: services/streaming-service/Dockerfile
      target: development
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/streaming_db
      REDIS_URL: redis://redis:6379/4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/streaming-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Search Service
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
      target: development
    ports:
      - "8005:8000"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/5
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/search-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Recommendation Service
  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
      target: development
    ports:
      - "8007:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/recommendation_db
      REDIS_URL: redis://redis:6379/6
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/recommendation-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Billing Service
  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
      target: development
    ports:
      - "8008:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/billing_db
      REDIS_URL: redis://redis:6379/7
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/billing-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
      target: development
    ports:
      - "8009:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/analytics_db
      REDIS_URL: redis://redis:6379/8
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/analytics-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      target: development
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/notification_db
      REDIS_URL: redis://redis:6379/9
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/notification-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Media Pipeline Service
  media-pipeline:
    build:
      context: .
      dockerfile: services/media-pipeline/Dockerfile
      target: development
    ports:
      - "8011:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/media_db
      REDIS_URL: redis://redis:6379/10
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/media-pipeline:/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
      - wildframe-network

  # Postgres Exporter for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://wildframe:wildframe_dev_password@postgres:5432/wildframe_db?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - wildframe-network

  # Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - wildframe-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  loki_data:
  jaeger_data:

networks:
  wildframe-network:
    driver: bridge
