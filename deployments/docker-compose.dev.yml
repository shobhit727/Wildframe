      REDIS_URL: redis://redis:6379/7
      JWT_ALGORITHM: RS256
      JWT_JWKS_URL: http://auth-service:8000/.well-known/jwks.json
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      # --- Stripe (development) -------------------------------------------
      # billing-service reads these five in app/core/settings.py. Each already
      # carries a deliberately-fake placeholder default in that file, so nothing
      # here is required for the service to boot; declaring them explicitly makes
      # the dev contract visible and overridable instead of an invisible fallback.
      #
      # The defaults below are intentionally identical to the settings.py
      # defaults -- one documented value, no compose/code drift. STRIPE_API_KEY
      # is a syntactically-shaped but non-existent Stripe test key: Stripe
      # rejects it with 401, so it cannot authenticate against any real account,
      # and settings.py refuses any sk_test_* value outside development. These
      # are placeholders, not credentials; never commit a real key here.
      #
      # To use real Stripe *test-mode* keys, export them (or put them in a local
      # .env -- see deployments/.env.example) before `docker compose up`; the
      # VAR-defaults form is the same convention the Kafka credentials below use.
      #
      # STRIPE_WEBHOOK_SECRET is pinned to the settings.py default on purpose:
      # tests/integration/test_billing_webhook_idempotency.py signs its replayed
      # payloads with this exact value (tests/integration/conftest.py), so
      # changing it here without changing that suite breaks webhook verification.
      # Without real keys, checkout routes answer 502 "Payment provider
      # unavailable" -- that is the placeholder being rejected, not a provider
      # outage. See docs/DEVELOPMENT.md for the Stripe-backed test path.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_default_change_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_default_change_me}
      STRIPE_SVOD_PRICE_ID: ${STRIPE_SVOD_PRICE_ID:-price_default_svod}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://wildframe.com/billing/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://wildframe.com/billing/cancel}
      KAFKA_SASL_USERNAME: ${BILLING_SERVICE_KAFKA_USERNAME:-billing-service}
      KAFKA_SASL_PASSWORD: ${BILLING_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ../services/billing-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
