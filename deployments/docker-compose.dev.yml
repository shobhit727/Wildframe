      REDIS_URL: redis://redis:6379/13
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${UPLOADS_SERVICE_KAFKA_USERNAME:-uploads-service}
      KAFKA_SASL_PASSWORD: ${UPLOADS_SERVICE_KAFKA_PASSWORD:-wildframe-dev}
      KAFKA_CLIENT_ID: uploads-service
      KAFKA_GROUP_ID: uploads-service
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/uploads-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    healthcheck: *backend-healthcheck
    networks:
    - wildframe-network
  media-pipeline:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/media-pipeline/Dockerfile
      target: development
    environment:
      # Bearer token for the production /metrics guard (#841); matches the
      # file Prometheus reads via bearer_token_file.
      METRICS_TOKEN: ${METRICS_TOKEN:-wildframe-metrics-dev}
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/media_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/10
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: ${MEDIA_PIPELINE_KAFKA_USERNAME:-media-pipeline}
      KAFKA_SASL_PASSWORD: ${MEDIA_PIPELINE_KAFKA_PASSWORD:-wildframe-dev}
      KAFKA_CLIENT_ID: media-pipeline
      KAFKA_GROUP_ID: media-pipeline
      KAFKA_SSL_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - ../services/media-pipeline:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    - ../packages/sdk/wildframe_compliance/wildframe_compliance:/app/wildframe_compliance
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    healthcheck: *backend-healthcheck
    networks:
    - wildframe-network
  postgres-exporter:
    restart: unless-stopped
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://wildframe:wildframe_dev_password@postgres:5432/wildframe_db?sslmode=disable
    ports:
    - 9187:9187
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - wildframe-network
  redis-exporter:
    restart: unless-stopped
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis:6379
    ports:
    - 9121:9121
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - wildframe-network
volumes:
  postgres_data: null
  redis_data: null
  kafka_data: null
  zookeeper_data: null
  elasticsearch_data: null
  prometheus_data: null
  grafana_data: null
  loki_data: null
  jaeger_data: null
networks:
  wildframe-network:
    driver: bridge
