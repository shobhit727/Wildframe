services:
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wildframe_db
      POSTGRES_USER: wildframe
      POSTGRES_PASSWORD: wildframe_dev_password
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../infrastructure/database/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U wildframe
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
    - 6379:6379
    command: redis-server --appendonly yes
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  kafka:
    restart: unless-stopped
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
    - 9092:9092
    - 29092:29092
    volumes:
    - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:29092
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks:
    - wildframe-network
  zookeeper:
    restart: unless-stopped
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
    - 2181:2181
    volumes:
    - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test:
      - CMD
      - echo
      - ruok
      - '|'
      - nc
      - localhost
      - '2181'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
    - 9200:9200
    - 9300:9300
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200 | grep -q cluster_name
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - wildframe-network
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    volumes:
    - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - prometheus_data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    networks:
    - wildframe-network
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    ports:
    - 3001:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/localhost.pem
      GF_SERVER_CERT_KEY: /etc/grafana/certs/localhost-key.pem
      GF_SERVER_ROOT_URL: https://localhost:3001
    volumes:
    - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning
    - grafana_data:/var/lib/grafana
    - ../apps/web/certificates:/etc/grafana/certs:ro
    depends_on:
    - prometheus
    networks:
    - wildframe-network
  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PROXY_X_FOR_COUNT: '1'
      PROXY_X_PROTO_COUNT: '1'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - wildframe-network
  caddy:
    restart: unless-stopped
    image: caddy:2
    ports:
    - 8000:8000
    - 8001:8001
    - 8002:8002
    - 8003:8003
    - 8004:8004
    - 8005:8005
    - 8006:8006
    - 8007:8007
    - 8008:8008
    - 8009:8009
    - 8010:8010
    - 8011:8011
    - 8012:8012
    - 8013:8013
    - 8014:8014
    - 8080:8080
    - 5050:5050
    - 9090:9090
    - 3100:3100
    - 16686:16686
    volumes:
    - ../infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - ../apps/web/certificates:/etc/caddy/certs:ro
    depends_on:
    - api-gateway
    - auth-service
    - user-service
    - content-service
    - streaming-service
    - search-service
    - admin-service
    - recommendation-service
    - billing-service
    - analytics-service
    - notification-service
    - media-pipeline
    - creators-service
    - moderation-service
    - uploads-service
    - pgadmin
    - prometheus
    - loki
    - jaeger
    networks:
    - wildframe-network
  loki:
    restart: unless-stopped
    image: grafana/loki:latest
    volumes:
    - ../infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
    - loki_data:/loki
    command:
    - -config.file=/etc/loki/local-config.yaml
    networks:
    - wildframe-network
  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:latest
    ports:
    - 14268:14268
    - 14250:14250
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - jaeger_data:/badger/data
    networks:
    - wildframe-network
  auth-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://wildframe:wildframe_dev_password@postgres:5432/auth_db
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://localhost:3000","http://192.168.1.14:3000","https://192.168.1.14:3000"]'
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ADMIN_EMAILS: demo@wildframe.com
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 15
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-key
      JAEGER_ENABLED: 'true'
      JAEGER_AGENT_HOST: jaeger
      JAEGER_AGENT_PORT: '6831'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
    - ../services/auth-service:/app
    - ../packages/sdk/wildframe_events:/app/wildframe_events
    - ../packages/sdk/wildframe_observability:/app/wildframe_observability
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    networks:
    - wildframe-network
