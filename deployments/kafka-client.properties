# Kafka client configuration for the broker healthcheck (dev stack only).
#
# The kafka service's healthcheck runs `kafka-broker-api-versions` INSIDE the
# broker container against localhost:29092. That listener is SASL_SSL, so the
# command must authenticate or it can never succeed and the container stays
# unhealthy forever, deadlocking every service that waits on
# `depends_on: kafka: condition: service_healthy`.
#
# This file is mounted read-only at /etc/kafka/kafka-client.properties and
# passed to the CLI via --command-config.
#
# Dev-only credentials. These match the defaults in the kafka service's
# `environment:` block; if you supply a real .env, update them to match.

security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="wildframe-dev";

# TLS: trust the self-signed dev CA/cert generated by scripts/generate-dev-certs.sh
# (mounted from apps/web/certificates as kafka-truststore.pem).
# NOTE: no keystore settings here -- this client does not present a certificate
# (no mTLS), and Kafka rejects ssl.keystore.password outright when the truststore
# is PEM format ("SSL key store password cannot be specified with PEM format").
ssl.truststore.location=/etc/kafka/secrets/kafka-truststore.pem
ssl.truststore.type=PEM

# The dev certificate's SANs are localhost/127.0.0.1/::1/192.168.1.14 only --
# there is no SAN for the compose service name "kafka" that the broker
# advertises. Hostname verification must therefore be disabled here, matching
# KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM="" on the broker.
ssl.endpoint.identification.algorithm=
