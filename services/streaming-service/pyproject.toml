[tool.poetry]
name = "streaming-service"
version = "1.0.0"
description = "Video streaming service with playback session management and manifest generation"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.141.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
sqlalchemy = { version = "^2.0.20", extras = ["asyncio"] }
asyncpg = "^0.30.0"
redis = "^5.0.1"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
python-json-logger = "^2.0.7"
email-validator = "^2.1.0"
httpx = "^0.25.0"
wildframe-observability = {path = "../../packages/sdk/wildframe_observability", develop = true}
wildframe-auth = {path = "../../packages/sdk/wildframe_auth", develop = true}
aiokafka = "^0.10.0"
wildframe-compliance = {path = "../../packages/sdk/wildframe_compliance", develop = true}
protobuf = ">=5.29.6,<6"
opentelemetry-api = "^1.43.0"
opentelemetry-sdk = "^1.43.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.43.0"
setuptools = ">=84,<86"
cryptography = ">=41.0.7,<51.0.0"

[tool.poetry.group.dev.dependencies]
types-python-jose = "^3.3.4"
mypy = "^1.7.0"
aiosqlite = "^0.19.0"
pytest = ">=7.4.3,<10.0.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"
faker = "^20.1.0"
testcontainers = {version = "^3.7.0", extras = ["postgresql"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short --strict-markers"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# Type policy for this service (issue #970).
#
# This block was previously absent, so `mypy app --config-file pyproject.toml`
# ran on mypy's defaults while the rest of the repo was held to a real policy.
# The flags below are copied verbatim from the root pyproject.toml [tool.mypy]
# section so this service is checked the same way the root policy describes.
# Per-service history and the per-module overrides that follow mirror the
# convention already used by services/auth-service (70b4d68a) and
# services/search-service, which pin python_version to the 3.11 floor and scope
# `follow_imports` around dependencies that ship syntax newer than that floor.
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

# `deprecated` 3.0.0 is pulled in transitively by the OpenTelemetry exporters and
# declares its type aliases with PEP 695 `type X = ...`, which is 3.12+ syntax.
# With python_version pinned to 3.11 above, mypy parses that dependency's source
# with the 3.11 grammar and fails on a file this service does not own. Raising
# python_version to 3.13 would also silence it, but that gives up checking
# against the 3.11 floor we actually declare in requires-python. Skipping the
# import is the accurate fix. Same fix as services/auth-service (70b4d68a).
[[tool.mypy.overrides]]
module = ["deprecated.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true
ignore_errors = true
