[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
requires-python = ">=3.11,<3.16"
name = "wildframe-creators-service"
version = "1.0.0"
description = "Creators service for Wildframe platform"

[tool.poetry]
name = "wildframe-creators-service"
version = "1.0.0"
description = "Creators service for Wildframe platform"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.25.0"
wildframe-observability = {path = "../../packages/sdk/wildframe_observability", develop = true}
wildframe-compliance = {path = "../../packages/sdk/wildframe_compliance", develop = true}
prometheus-client = "^0.18.0"
stripe = "^7.0.0"

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.19.0"
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=23.11,<27.0"
mypy = "^1.7.0"
types-python-jose = "^3.3.4"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "aiokafka"
ignore_missing_imports = true
ignore_untyped = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true
ignore_untyped = true

[[tool.mypy.overrides]]
module = "aiokafka.consumer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.consumer.consumer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyotp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bcrypt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "stripe.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.models.onboarding"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.models.payout"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.models.commerce"
ignore_missing_imports = true
