[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
requires-python = ">=3.11,<3.16"
name = "wildframe-uploads-service"
version = "1.0.0"
description = "Uploads service for Wildframe platform"

[tool.poetry]
name = "wildframe-uploads-service"
version = "1.0.0"
description = "Uploads service for Wildframe platform"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.25.0"
prometheus-client = "^0.18.0"
aiokafka = "^0.10.0"
boto3 = "^1.29.0"
wildframe-observability = {path = "../../packages/sdk/wildframe_observability", develop = true}

[tool.poetry.group.dev.dependencies]
boto3-stubs = {extras = ["s3"], version = ">=1.29,<2"}
types-python-jose = "^3.3.4"
aiosqlite = "^0.19.0"
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=23.11,<27.0"
mypy = "^1.7.0"
