[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
requires-python = ">=3.11,<3.16"
name = "wildframe-auth-service"
version = "1.0.0"
description = "Authentication and authorization service"

[tool.poetry]
name = "wildframe-auth-service"
version = "1.0.0"
description = "Authentication and authorization service"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
alembic = "^1.12.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyjwt = "^2.8.0"
bcrypt = "^4.1.0"
python-multipart = ">=0.0.6,<0.0.32"
aiokafka = "^0.11.0"
python-json-logger = "^2.0.0"
email-validator = "^2.1.0"
httpx = "^0.25.0"
opentelemetry-api = "^1.43.0"
opentelemetry-sdk = "^1.43.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.43.0"
protobuf = ">=5.29.6,<6"
opentelemetry-instrumentation-fastapi = "^0.64b0"
opentelemetry-instrumentation-sqlalchemy = "^0.64b0"
opentelemetry-instrumentation-redis = "^0.64b0"
prometheus-client = "^0.18.0"
pyotp = "^2.9.0"
setuptools = ">=84,<86"
wildframe-observability = {path = "../../packages/sdk/wildframe_observability", develop = true}
wildframe-compliance = {path = "../../packages/sdk/wildframe_compliance", develop = true}
wildframe-auth = {path = "../../packages/sdk/wildframe_auth", develop = true}

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.19.0"
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=23.11,<27.0"
isort = "^5.12.0"
mypy = "^1.7.0"
types-python-jose = "^3.3.4"
faker = "^20.0.0"
testcontainers = "^3.7.0"
httpx = "^0.25.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
strict_optional = true

# `deprecated` 3.0.0 (pulled in transitively, and selected by the resolver for
# this interpreter) declares its type aliases with PEP 695 `type X = ...`, which
# is Python 3.12+ syntax. With python_version pinned to 3.11 above -- the floor
# this service actually declares in `requires-python` -- mypy parses that
# dependency's source with the 3.11 grammar and fails on a file we do not own:
#
#   .venv/.../site-packages/deprecated/classic.py:33: error:
#     Type statement is only supported in Python 3.12 and greater  [syntax]
#
# Raising python_version to 3.13 would also silence it, but that gives up
# checking our own code against the 3.11 floor we advertise, so a 3.12-only
# construct in app/ would pass. This override keeps the 3.11 check and stops
# mypy analysing a third-party package's internals, which is the actual defect.
[[tool.mypy.overrides]]
module = ["deprecated.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "aiokafka"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.consumer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.consumer.consumer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyotp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bcrypt.*"
ignore_missing_imports = true
