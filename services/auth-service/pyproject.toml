[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
requires-python = ">=3.11,<3.16"
name = "wildframe-auth-service"
version = "1.0.0"
description = "Authentication and authorization service"

[tool.poetry]
name = "wildframe-auth-service"
version = "1.0.0"
description = "Authentication and authorization service"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyjwt = "^2.8.0"
bcrypt = "^4.1.0"
python-multipart = ">=0.0.6,<0.0.32"
aiokafka = "^0.11.0"
python-json-logger = "^2.0.0"
email-validator = "^2.1.0"
httpx = "^0.25.0"
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-exporter-jaeger = "^1.20.0"
opentelemetry-instrumentation-fastapi = "^0.41b0"
opentelemetry-instrumentation-sqlalchemy = "^0.41b0"
opentelemetry-instrumentation-redis = "^0.41b0"
prometheus-client = "^0.18.0"
pyotp = "^2.9.0"
setuptools = ">=84,<86"
wildframe-observability = {path = "../../packages/sdk/wildframe_observability", develop = true}

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.19.0"
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=23.11,<27.0"
isort = "^5.12.0"
mypy = "^1.7.0"
types-python-jose = "^3.3.4"
faker = "^20.0.0"
testcontainers = "^3.7.0"
httpx = "^0.25.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
