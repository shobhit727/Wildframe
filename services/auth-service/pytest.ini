[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q --asyncio-mode=auto
norecursedirs = .git __pycache__ .venv venv .mypy_cache .pytest_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::PydanticDeprecatedSince20

# Ignore generated batch test files
ignore =
    tests/test_batch*.py