[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe-api-gateway-service"
version = "1.0.0"
description = "Api Gateway service for Wildframe platform"

[tool.poetry]
name = "wildframe-api-gateway-service"
version = "1.0.0"
description = "Api Gateway service for Wildframe platform"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
redis = "^5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyjwt = "^2.8.0"
httpx = "^0.25.0"
wildframe-observability = {path = "../../packages/sdk/wildframe_observability", develop = true}
prometheus-client = "^0.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.11.0"
mypy = "^1.7.0"
