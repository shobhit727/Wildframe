[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe-auth"
version = "1.0.0"
description = "Shared JWT verification via JWKS for Wildframe"

[tool.poetry]
name = "wildframe-auth"
version = "1.0.0"
description = "Shared JWT verification via JWKS"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "wildframe_auth"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
# Floor is 49.0.0, not the old ^42.0.0 (<43), which pinned every dependent service
# to a cryptography with three open advisories: CVE-2026-26007 (subgroup
# validation, fixed 46.0.5), CVE-2026-69249 (duplicate self-signed intermediate,
# fixed 49.0.0) and GHSA-537c-gmf6-5ccf (vulnerable OpenSSL in the wheels, fixed
# 48.0.1). The upper bound matches the existing convention in the services that
# declare this directly, and admits the 50.0.0 the root lock already resolves.
cryptography = ">=49.0.0,<51.0.0"
httpx = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
black = ">=23.11,<27.0"
isort = "^5.12.0"
mypy = "^1.7.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
