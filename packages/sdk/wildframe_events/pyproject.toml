[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe-events"
version = "1.0.0"
description = "Shared event contracts and infrastructure for Wildframe microservices"

[tool.poetry]
name = "wildframe-events"
version = "1.0.0"
description = "Shared event contracts and infrastructure for Wildframe microservices"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "wildframe_events", from = ".."}]

[tool.poetry.dependencies]
python = "^3.13"
aiokafka = {version = "^0.9.0", optional = true}

[tool.poetry.extras]
kafka = ["aiokafka"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=24.3,<27.0"
isort = "^5.12.0"
mypy = "^1.7.0"
httpx = "^0.25.0"