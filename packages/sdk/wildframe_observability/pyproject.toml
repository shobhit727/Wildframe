[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe-observability"
version = "1.0.0"
description = "Shared observability SDK for Wildframe microservices"

[tool.poetry]
name = "wildframe-observability"
version = "1.0.0"
description = "Structured JSON logging, correlation IDs, Prometheus metrics middleware, health responses"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "wildframe_observability", from = ".."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
# The package imports these lazily but unconditionally on its instrumentation
# paths, so they belong here rather than being left to each consumer to
# discover. They were previously undeclared, which meant `pip install -e`
# produced an importable package whose primary feature raised
# ModuleNotFoundError at call time.
# The instrumentation floor is 0.64b0 because that is the first release whose
# _get_route_details() tolerates a scope["route"] that is an _IncludedRouter.
# Below it, every include_router route raises AttributeError and 500s. 0.50b0
# and 0.55b0 carry the identical unguarded code, so "bump one release" is not a
# fix. See issue #978.
#
# The API/SDK floor is 1.43.0 and must move with it: 0.64b0 instrumentations
# require semantic-conventions==0.64b0, and every SDK below 1.43.0 pins
# semantic-conventions to its own older 0.4x, so a lower floor resolves to a set
# that cannot install. 1.43.0 is the exact pairing for semantic-conventions
# 0.64b0.
opentelemetry-api = "^1.43.0"
opentelemetry-sdk = "^1.43.0"
opentelemetry-instrumentation = "^0.64b0"
opentelemetry-instrumentation-fastapi = "^0.64b0"
opentelemetry-instrumentation-asgi = "^0.64b0"
# Traces ship over OTLP. The Jaeger exporter was discontinued upstream at 1.21.0
# with no later release, and it is incompatible with SDK 1.43.0, so it was not a
# choice between it and OTLP. Jaeger has ingested OTLP natively since 1.35.
opentelemetry-exporter-otlp = "^1.43.0"
prometheus-client = "^0.18.0"
starlette = ">=0.27.0"
fastapi = "^0.141.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=24.3,<27.0"
isort = "^5.12.0"
mypy = "^1.7.0"
httpx = "^0.25.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["wildframe_observability*"]
