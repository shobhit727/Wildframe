[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe-observability"
version = "1.0.0"
description = "Shared observability SDK for Wildframe microservices"

[tool.poetry]
name = "wildframe-observability"
version = "1.0.0"
description = "Structured JSON logging, correlation IDs, Prometheus metrics middleware, health responses"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
packages = [{include = "wildframe_observability", from = ".."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
# The package imports these lazily but unconditionally on its instrumentation
# paths, so they belong here rather than being left to each consumer to
# discover. They were previously undeclared, which meant `pip install -e`
# produced an importable package whose primary feature raised
# ModuleNotFoundError at call time.
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation = "^0.49b0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-instrumentation-asgi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.27.0"
# Discontinued upstream at 1.21; wire.py imports it lazily and the
# import already carries a type: ignore, so pin to the last release
# rather than leaving an undeclared optional import.
opentelemetry-exporter-jaeger-thrift = "^1.21.0"
prometheus-client = "^0.18.0"
starlette = ">=0.27.0"
fastapi = "^0.141.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<10.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = ">=24.3,<27.0"
isort = "^5.12.0"
mypy = "^1.7.0"
httpx = "^0.25.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["wildframe_observability*"]
