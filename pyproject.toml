[tool.pytest.ini_options]
testpaths = ["services/*/tests", "packages/*/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v --cov=services --cov=packages --cov-report=term-missing:skip-covered"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "db: Tests requiring database",
]

[tool.coverage.run]
source = ["services", "packages"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.pylint.master]
load-plugins = []
jobs = 0

[tool.pylint.messages_control]
disable = [
    "C0111",  # Missing module docstring
    "R0801",  # Duplicate code
    "W0212",  # Protected access
]

[tool.pylint.format]
max-line-length = 100

