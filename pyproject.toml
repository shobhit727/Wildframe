[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe"
version = "1.0.0"
description = "Production-grade OTT streaming platform"
authors = [
    {name = "Wildframe Team", email = "engineering@wildframe.com"}
]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11,<3.16"

[tool.poetry]
name = "wildframe"
version = "1.0.0"
description = "Production-grade OTT streaming platform"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
readme = "README.md"
packages = [
    {include = "services"},
    {include = "packages"},
]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"

# FastAPI ecosystem
fastapi = ">=0.111,<0.142"
uvicorn = {extras = ["standard"], version = ">=0.24,<0.53"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
asyncpg = ">=0.30,<0.32"
psycopg2-binary = "^2.9.0"

# Redis
redis = ">=5,<9"

# Kafka
kafka-python = ">=2,<4"
aiokafka = ">=0.10,<0.15"
protobuf = ">=5.29.6,<8"

# Search
elasticsearch = ">=8.10,<10.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-multipart = ">=0.0.6,<0.0.33"
python-keycloak = ">=3.8,<8.0"

# Observability
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-exporter-jaeger = "^1.20.0"
opentelemetry-instrumentation-fastapi = "^0.41b0"
opentelemetry-instrumentation-sqlalchemy = "^0.41b0"
opentelemetry-instrumentation-redis = "^0.41b0"
prometheus-client = ">=0.18,<0.27"
python-json-logger = ">=2,<5"

# Utils
httpx = ">=0.25,<0.29"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
email-validator = "^2.1.0"
pycountry = ">=22.3,<27.0"

pytest-xdist = "^3.5.0"
faker = "^20.0.0"

# Code quality
black = ">=23.11,<27.0"
isort = "^5.12.0"
pylint = ">=3,<5"
mypy = ">=1.7,<3.0"
flake8 = ">=6.1,<8.0"

# API
marshmallow = "^3.20.0"

# Async utilities
anyio = "^3.7.1"
aiofiles = "^23.2.0"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

# Lint is pinned so an unpinned `pip install ruff` in CI cannot change the
# result between runs (ruff has been changing its default select set between
# releases). We enforce the stable, real-code rules and fix violations rather
# than chase flaky floaters (DTZ, I001, preview) that newer ruff enables by
# default.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F"]
# E402 (module-level import placed after a docstring/code): legacy cosmetic
# decoration used across the 15 services' app entrypoints.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# E712 `col == True` is the *correct* SQLAlchemy expression in where() clauses;
# `if col:` would pass the Column object truthily and never filter.
"**/repositories/**/*.py" = ["E712", "E711"]
"**/repositories.py" = ["E712", "E711"]
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
# explicit_package_bases = true
# mypy exclusions handled via --exclude flag
