[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wildframe"
version = "1.0.0"
description = "Production-grade OTT streaming platform"
authors = [
    {name = "Wildframe Team", email = "engineering@wildframe.com"}
]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11,<3.16"

[tool.poetry]
name = "wildframe"
version = "1.0.0"
description = "Production-grade OTT streaming platform"
authors = ["Wildframe Team <engineering@wildframe.com>"]
license = "Proprietary"
readme = "README.md"
packages = [
    {include = "services"},
    {include = "packages"},
]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"

# FastAPI ecosystem
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.4.0"
pydantic-settings = "^2.0.0"

# Database
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.0"

# Redis
redis = "^5.0.0"

# Kafka
kafka-python = "^2.0.0"
aiokafka = "^0.10.0"

# Search
elasticsearch = "^8.10.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-multipart = "^0.0.6"
python-keycloak = ">=3.8,<8.0"

# Observability
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-exporter-jaeger = "^1.20.0"
opentelemetry-instrumentation-fastapi = "^0.41b0"
opentelemetry-instrumentation-sqlalchemy = "^0.41b0"
opentelemetry-instrumentation-redis = "^0.41b0"
prometheus-client = "^0.18.0"
python-json-logger = "^2.0.0"

# Utils
httpx = "^0.25.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
email-validator = "^2.1.0"
pycountry = "^22.3.0"

# Development & Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.5.0"
faker = "^20.0.0"

# Code quality
black = "^23.11.0"
isort = "^5.12.0"
pylint = "^3.0.0"
mypy = "^1.7.0"
flake8 = "^6.1.0"

# API
marshmallow = "^3.20.0"

# Async utilities
anyio = "^4.0.0"
aiofiles = "^23.2.0"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["services/*/tests", "packages/*/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v --cov=services --cov=packages --cov-report=term-missing:skip-covered"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "db: Tests requiring database",
]

[tool.coverage.run]
source = ["services", "packages"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.pylint.master]
load-plugins = []
jobs = 0

[tool.pylint.messages_control]
disable = [
    "C0111",  # Missing module docstring
    "R0801",  # Duplicate code
    "W0212",  # Protected access
]

[tool.pylint.format]
max-line-length = 100

[tool.poetry.scripts]
# Add CLI commands here
