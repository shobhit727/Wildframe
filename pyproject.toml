[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Test modules packaged under the app package (services/<svc>/app/tests/)
# are excluded from type checking like top-level tests; their dependencies
# (e.g. httpx ASGI transports) differ in stub strictness across versions.

[[tool.mypy.overrides]]
module = "app.tests.*"
ignore_errors = true

# aiokafka has no stubs; silence missing-import and untyped-import errors
[[tool.mypy.overrides]]
module = "aiokafka"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.consumer"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.consumer.consumer"
ignore_missing_imports = true
# jose.exceptions has incomplete stubs in types-python-jose

[[tool.mypy.overrides]]
module = "jose.exceptions"
ignore_missing_imports = true
ignore_errors = true
# Exclude all services with duplicate "app" module names
[[tool.mypy.overrides]]
module = "services.admin_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.analytics_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.billing_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.content_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.streaming_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.search_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.recommendation_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.media_pipeline.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.uploads_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.user_service.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.moderation_service.*"
