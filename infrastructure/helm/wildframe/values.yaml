replicaCount: 1

image:
  repository: ghcr.io/shobhit727/wildframe
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

namespace: wildframe

infra:
  postgresHost: "postgres"
  postgresPort: 5432
  redisHost: "redis-master"
  redisPort: 6379
  kafkaBootstrap: "kafka:9092"
  kafkaPort: 9092
  jaegerAgentHost: "jaeger-agent"
  jaegerAgentPort: 6831

# Rolling update bounds: never take the whole service offline, never more
# than one extra pod at a time (surge) during upgrades.
strategy:
  maxSurge: 1
  maxUnavailable: 0

# Graceful shutdown window so in-flight requests/jobs can finish before SIGKILL.
terminationGracePeriodSeconds: 60

# Services never call the Kubernetes API (secrets/config are injected via
# secretKeyRef/configMapKeyRef), so the projected service-account token is
# unnecessary attack surface.
automountServiceAccountToken: false

# Probe thresholds tuned to tolerate dependency latency and rolling
# deployments without restart storms. Override per service via
# services.<name>.probes.<probeName> (merged over these defaults).
probes:
  startupProbe:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

services:
  api-gateway:
    containerPort: 8000
    replicas: 2
    env:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  auth-service:
    containerPort: 8000
    replicas: 1
    db: auth_db
    env:
      PASSWORD_BCRYPT_ROUNDS: "12"
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  user-service:
    containerPort: 8000
    replicas: 1
    db: user_db
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  content-service:
    containerPort: 8000
    replicas: 1
    db: content_db
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  streaming-service:
    containerPort: 8000
    replicas: 1
    db: streaming_db
  search-service:
    containerPort: 8000
    replicas: 1
    db: search_db
  recommendation-service:
    containerPort: 8000
    replicas: 1
    db: recommendation_db
  billing-service:
    containerPort: 8000
    replicas: 1
    db: billing_db
  analytics-service:
    containerPort: 8000
    replicas: 1
    db: analytics_db
  notification-service:
    containerPort: 8000
    replicas: 1
    db: notification_db
  media-pipeline:
    containerPort: 8000
    replicas: 1
    db: media_pipeline_db
    terminationGracePeriodSeconds: 120
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2048Mi
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  creators-service:
    containerPort: 8000
    replicas: 1
    db: creators_db
  moderation-service:
    containerPort: 8000
    replicas: 1
    db: moderation_db
  uploads-service:
    containerPort: 8000
    replicas: 1
    db: uploads_db
  admin-service:
    containerPort: 8000
    replicas: 1
    db: admin_db

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: wildframe.example.com
  # Namespace label (name) of the ingress controller that fronts api-gateway.
  controllerNamespace: ingress-nginx

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Deployed environments must provide these values through a Kubernetes Secret.
secrets:
  existingSecret: wildframe-runtime
  jwtSecretKey: JWT_SECRET_KEY
  postgresPasswordKey: POSTGRES_PASSWORD

kafka:
  enabled: true
  topics:
    - user.registered
    - user.login
    - token.revoked
