replicaCount: 1

image:
  repository: ghcr.io/shobhit727/wildframe
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

namespace: wildframe

infra:
  postgresHost: "postgres"
  postgresPort: 5432
  redisHost: "redis-master"
  redisPort: 6379
  kafkaBootstrap: "kafka:9092"
  kafkaPort: 9092
  jaegerAgentHost: "jaeger-agent"
  jaegerAgentPort: 6831

# Rolling update bounds: never take the whole service offline, never more
# than one extra pod at a time (surge) during upgrades.
strategy:
  maxSurge: 1
  maxUnavailable: 0

# Graceful shutdown window so in-flight requests/jobs can finish before SIGKILL.
terminationGracePeriodSeconds: 60

# Services never call the Kubernetes API (secrets/config are injected via
# secretKeyRef/configMapKeyRef), so the projected service-account token is
# unnecessary attack surface.
automountServiceAccountToken: false

# Probe thresholds tuned to tolerate dependency latency and rolling
# deployments without restart storms. Override per service via
# services.<name>.probes.<probeName> (merged over these defaults).
probes:
  startupProbe:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

services:
  api-gateway:
    containerPort: 8000
    replicas: 2
    env:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  auth-service:
    containerPort: 8000
    replicas: 1
    db: auth_db
    env:
      PASSWORD_BCRYPT_ROUNDS: "12"
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  user-service:
    containerPort: 8000
    replicas: 1
    db: user_db
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  content-service:
    containerPort: 8000
    replicas: 1
    db: content_db
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  streaming-service:
    containerPort: 8000
    replicas: 1
    db: streaming_db
  search-service:
    containerPort: 8000
    replicas: 1
    db: search_db
  recommendation-service:
    containerPort: 8000
    replicas: 1
    db: recommendation_db
  billing-service:
    containerPort: 8000
    replicas: 1
    db: billing_db
  analytics-service:
    containerPort: 8000
    replicas: 1
    db: analytics_db
  notification-service:
    containerPort: 8000
    replicas: 1
    db: notification_db
  media-pipeline:
    containerPort: 8000
    replicas: 1
    db: media_pipeline_db
    terminationGracePeriodSeconds: 120
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2048Mi
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  creators-service:
    containerPort: 8000
    replicas: 1
    db: creators_db
  moderation-service:
    containerPort: 8000
    replicas: 1
    db: moderation_db
  uploads-service:
    containerPort: 8000
    replicas: 1
    db: uploads_db
  admin-service:
    containerPort: 8000
    replicas: 1
    db: admin_db

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: wildframe.example.com
  # Namespace label (name) of the ingress controller that fronts api-gateway.
  controllerNamespace: ingress-nginx

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Deployed environments must provide these values through a Kubernetes Secret.
secrets:
  existingSecret: wildframe-runtime
  jwtSecretKey: JWT_SECRET_KEY
  postgresPasswordKey: POSTGRES_PASSWORD

# Migration job (single serialized job, not per-pod initContainers, issue #342).
migration:
  enabled: true
  image: ""
  # If empty, uses $.Values.image.repository/migration:$.Values.image.tag
  command: ["alembic", "upgrade", "head"]
  # Hook annotation: "pre-install" | "pre-upgrade" | "" (manual)
  hook: "pre-install"
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# External managed service CIDRs/FQDNs for NetworkPolicy egress.
# When set, egress rules allow traffic to these destinations instead of/in
# addition to in-cluster podSelectors (issues #347/#348).
external:
  postgres:
    enabled: false
    # CIDR blocks (e.g. "10.0.0.0/16") or FQDNs (requires Cilium/Calico FQDN support)
    cidrs: []
    fqdns: []
  redis:
    enabled: false
    cidrs: []
    fqdns: []

# Kafka SASL/ACL enablement (scaffold — requires Strimzi KafkaUser operator or manual ACLs, issues #550/#551).
kafka:
  enabled: true
  topics:
    - user.registered
    - user.login
    - token.revoked
  sasl:
    enabled: false
    mechanism: SCRAM-SHA-512
    # secretRef: name of secret containing sasl username/password keys
    secretRef: ""
  acl:
    enabled: false
    # Per-service topic ACLs (producer/consumer) — scaffold only, operator applies.
    # Example:
    # auth-service:
    #   produce: [user.registered, token.revoked]
    #   consume: [user.login]
    services: {}

# Global defaults for topology spread and pod anti-affinity (issue #387/#636).
# Override per service via services.<name>.topologySpread / .podAntiAffinity.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  # Optional: labelSelector to spread over (defaults to app label)
  # labelSelector: {}

podAntiAffinity:
  enabled: true
  # "preferred" (soft) or "required" (hard)
  type: preferred
  weight: 100
  topologyKey: kubernetes.io/hostname

# Container security hardening (issues #519/#520/#521).
containerSecurity:
  readOnlyRootFilesystem: true
  # App writes to /tmp and /app/logs via emptyDir volumes (already mounted).

# ServiceAccount per workload (least-privilege RBAC, issue #343).
serviceAccount:
  create: true
  # Annotations for IRSA / workload identity.
  annotations: {}
  # Automount service account token (false by global default).
  automountToken: false