# Default values (development): in-cluster postgres/redis via docker-compose or
# cluster DNS (postgres, redis-master). Production MUST override with managed
# external endpoints (RDS/ElastiCache) via values-production.yaml;
# validation in templates/validate-external.yaml fails closed for
# namespace wildframe-production if external config is missing.
replicaCount: 1
image:
  repository: ghcr.io/shobhit727/wildframe
  tag: 1.0.0
  pullPolicy: IfNotPresent
imagePullSecrets: []
namespace: wildframe
infra:
  postgresHost: postgres
  postgresPort: 5432
  redisHost: redis-master
  redisPort: 6379
  kafkaBootstrap: kafka:9092
  kafkaPort: 9092
  jaegerAgentHost: jaeger-agent
  jaegerAgentPort: 6831
strategy:
  maxSurge: 1
  maxUnavailable: 0
terminationGracePeriodSeconds: 60
automountServiceAccountToken: false
probes:
  startupProbe:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
services:
  api-gateway:
    containerPort: 8000
    replicas: 2
    env:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  auth-service:
    containerPort: 8000
    replicas: 1
    db: auth_db
    env:
      PASSWORD_BCRYPT_ROUNDS: '12'
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  user-service:
    containerPort: 8000
    replicas: 1
    db: user_db
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  content-service:
    containerPort: 8000
    replicas: 1
    db: content_db
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  streaming-service:
    containerPort: 8000
    replicas: 1
    db: streaming_db
  search-service:
    containerPort: 8000
    replicas: 1
    db: search_db
  recommendation-service:
    containerPort: 8000
    replicas: 1
    db: recommendation_db
  billing-service:
    containerPort: 8000
    replicas: 1
    db: billing_db
  analytics-service:
    containerPort: 8000
    replicas: 1
    db: analytics_db
  notification-service:
    containerPort: 8000
    replicas: 1
    db: notification_db
  media-pipeline:
    containerPort: 8000
    replicas: 1
    db: media_pipeline_db
    terminationGracePeriodSeconds: 120
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2048Mi
    probes:
      readinessProbe:
        path: /ready
      startupProbe:
        path: /ready
  creators-service:
    containerPort: 8000
    replicas: 1
    db: creators_db
  moderation-service:
    containerPort: 8000
    replicas: 1
    db: moderation_db
  uploads-service:
    containerPort: 8000
    replicas: 1
    db: uploads_db
  admin-service:
    containerPort: 8000
    replicas: 1
    db: admin_db
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: nginx
  host: wildframe.example.com
  controllerNamespace: ingress-nginx
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
secrets:
  existingSecret: wildframe-runtime
  jwtSecretKey: JWT_SECRET_KEY
  postgresPasswordKey: POSTGRES_PASSWORD
migration:
  enabled: true
  image: ''
  command:
  - alembic
  - upgrade
  - head
  hook: pre-install
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
external:
  postgres:
    enabled: false
    cidrs: []
    fqdns: []
  redis:
    enabled: false
    cidrs: []
    fqdns: []
# Production managed data-plane: RDS Aurora PostgreSQL (backupRetention 30d, PITR,
# KMS encryption, Multi-AZ) and ElastiCache Redis (multi-AZ, KMS, slow-log).
# See infrastructure/terraform/main.tf and helm values-production.yaml for
# the documented production path; in-chart postgres/redis is dev-only.
kafka:
  enabled: true
  topics:
  - billing.checkout.session.created
  - billing.payout.accrued
  - billing.payout.transferred
  - billing.subscription.cancelled
  - billing.subscription.created
  - billing.subscription.updated
  - content.deleted
  - content.encoded
  - content.metadata_extracted
  - content.packaged
  - content.pipeline.failed
  - content.published
  - content.scanned
  - content.unpublished
  - content.uploaded
  - content.uploaded.aborted
  - creator.floor.adjusted
  - creator.milestone.reached
  - creator.onboarded
  - creator.suspended
  - moderation.decision_made
  - moderation.flagged
  - user.moderated
  - user.registered
  sasl:
    enabled: true
    mechanism: PLAIN
    secretRef: wildframe-kafka-sasl
    securityProtocol: SASL_SSL
  acl:
    enabled: true
    services:
      uploads-service:
        produce:
        - content.uploaded
        - content.uploaded.aborted
        consume: []
      media-pipeline:
        produce:
        - content.scanned
        - content.metadata_extracted
        - content.encoded
        - content.packaged
        - content.pipeline.failed
        - content.uploaded.dlq
        consume:
        - content.uploaded
      content-service:
        produce:
        - content.published
        - content.deleted
        - content.unpublished
        - content.uploaded.dlq
        - content.uploaded.aborted.dlq
        - content.metadata_extracted.dlq
        - content.encoded.dlq
        - content.packaged.dlq
        - content.pipeline.failed.dlq
        - creator.suspended.dlq
        - moderation.decision_made.dlq
        consume:
        - content.uploaded
        - content.uploaded.aborted
        - content.metadata_extracted
        - content.encoded
        - content.packaged
        - content.pipeline.failed
        - creator.suspended
        - moderation.decision_made
      streaming-service:
        produce:
        - content.encoded.dlq
        - content.packaged.dlq
        - content.published.dlq
        consume:
        - content.encoded
        - content.packaged
        - content.published
      search-service:
        produce:
        - content.metadata_extracted.dlq
        - content.published.dlq
        - content.deleted.dlq
        - content.unpublished.dlq
        consume:
        - content.metadata_extracted
        - content.published
        - content.deleted
        - content.unpublished
      recommendation-service:
        produce:
        - content.published.dlq
        - content.deleted.dlq
        - content.unpublished.dlq
        consume:
        - content.published
        - content.deleted
        - content.unpublished
      billing-service:
        produce:
        - billing.subscription.created
        - billing.subscription.updated
        - billing.subscription.cancelled
        - billing.checkout.session.created
        - billing.payout.accrued
        - billing.payout.transferred
        - creator.onboarded.dlq
        - creator.milestone.reached.dlq
        - creator.floor.adjusted.dlq
        - creator.suspended.dlq
        consume:
        - creator.onboarded
        - creator.milestone.reached
        - creator.floor.adjusted
        - creator.suspended
      creators-service:
        produce:
        - creator.onboarded
        - creator.milestone.reached
        - creator.floor.adjusted
        - billing.subscription.created.dlq
        - billing.subscription.cancelled.dlq
        - billing.payout.accrued.dlq
        - billing.payout.transferred.dlq
        - creator.suspended.dlq
        consume:
        - billing.subscription.created
        - billing.subscription.cancelled
        - billing.payout.accrued
        - billing.payout.transferred
        - creator.suspended
      moderation-service:
        produce:
        - moderation.flagged
        - moderation.decision_made
        - creator.suspended
        - content.scanned.dlq
        consume:
        - content.scanned
      notification-service:
        produce:
        - content.scanned.dlq
        - content.published.dlq
        - content.pipeline.failed.dlq
        - billing.subscription.created.dlq
        - billing.subscription.updated.dlq
        - billing.subscription.cancelled.dlq
        - creator.onboarded.dlq
        - creator.milestone.reached.dlq
        - creator.suspended.dlq
        - moderation.flagged.dlq
        - moderation.decision_made.dlq
        - billing.payout.transferred.dlq
        consume:
        - content.scanned
        - content.published
        - content.pipeline.failed
        - billing.subscription.created
        - billing.subscription.updated
        - billing.subscription.cancelled
        - creator.onboarded
        - creator.milestone.reached
        - creator.suspended
        - moderation.flagged
        - moderation.decision_made
        - billing.payout.transferred
      analytics-service:
        produce:
        - content.published.dlq
        - billing.subscription.created.dlq
        - billing.subscription.cancelled.dlq
        - billing.checkout.session.created.dlq
        - creator.floor.adjusted.dlq
        - moderation.flagged.dlq
        - moderation.decision_made.dlq
        consume:
        - content.published
        - billing.subscription.created
        - billing.subscription.cancelled
        - billing.checkout.session.created
        - creator.floor.adjusted
        - moderation.flagged
        - moderation.decision_made
      user-service:
        produce:
        - billing.subscription.created.dlq
        - billing.subscription.updated.dlq
        - billing.subscription.cancelled.dlq
        consume:
        - billing.subscription.created
        - billing.subscription.updated
        - billing.subscription.cancelled
    authorizer: kafka.security.authorizer.AclAuthorizer
    allowEveryoneIfNoAclFound: false
    superUsers:
    - User:admin
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
podAntiAffinity:
  enabled: true
  type: preferred
  weight: 100
  topologyKey: kubernetes.io/hostname
containerSecurity:
  readOnlyRootFilesystem: true
serviceAccount:
  create: true
  annotations: {}
  automountToken: false
