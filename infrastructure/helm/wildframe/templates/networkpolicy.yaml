# Per-service NetworkPolicy: each workload only reaches the infra it needs
# (DNS, Redis, Kafka, Jaeger agent, Postgres when it has a db) and only
# accepts app traffic from api-gateway (plus the ingress controller for
# api-gateway itself). Infra pods are addressed by the labels used by the
# cluster topology (app: postgres / redis / kafka / jaeger-agent).
{{- range $name, $svc := .Values.services }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-netpol
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app: {{ $name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- if eq $name "api-gateway" }}
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ $.Values.ingress.controllerNamespace }}
    ports:
    - protocol: TCP
      port: {{ $svc.containerPort }}
  {{- end }}
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: {{ $svc.containerPort }}
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: {{ $.Values.infra.redisPort }}
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: {{ $.Values.infra.kafkaPort }}
  - to:
    - podSelector:
        matchLabels:
          app: jaeger-agent
    ports:
    - protocol: UDP
      port: {{ $.Values.infra.jaegerAgentPort }}
  {{- if $svc.db }}
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: {{ $.Values.infra.postgresPort }}
  {{- end }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "wildframe.name" $ }}
    ports:
    - protocol: TCP
      port: {{ $svc.containerPort }}
{{- end }}
