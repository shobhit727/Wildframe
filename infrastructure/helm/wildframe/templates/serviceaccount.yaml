{{- if .Values.serviceAccount.create }}
{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
    {{- include "wildframe.labels" $ | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Services never call the Kubernetes API: secrets/config are injected via
# secretKeyRef/configMapKeyRef, so these accounts intentionally carry NO
# Role/RoleBinding (least privilege, issue #343).
{{- end }}
{{- end }}