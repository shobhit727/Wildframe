{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
    {{- include "wildframe.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default $.Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ (default dict $svc.strategy).maxSurge | default $.Values.strategy.maxSurge }}
      maxUnavailable: {{ (default dict $svc.strategy).maxUnavailable | default $.Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "wildframe.labels" $ | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io.path: "/metrics"
    spec:
      automountServiceAccountToken: {{ $svc.automountServiceAccountToken | default $.Values.automountServiceAccountToken }}
      {{- if $.Values.serviceAccount.create }}
      serviceAccountName: {{ $name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds | default $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if $.Values.topologySpread.enabled }}
      topologySpreadConstraints:
      {{- $ts := default dict $svc.topologySpread }}
      {{- $globalTS := $.Values.topologySpread }}
        - maxSkew: {{ $ts.maxSkew | default $globalTS.maxSkew }}
          topologyKey: {{ $ts.topologyKey | default $globalTS.topologyKey }}
          whenUnsatisfiable: {{ $ts.whenUnsatisfiable | default $globalTS.whenUnsatisfiable }}
          labelSelector:
            {{- $ls := $ts.labelSelector | default $globalTS.labelSelector }}
            {{- if $ls }}
              {{- toYaml $ls | nindent 12 }}
            {{- else }}
              matchLabels:
                app: {{ $name }}
            {{- end }}
      {{- end }}
      {{- if $.Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- $pa := default dict $svc.podAntiAffinity }}
          {{- $globalPA := $.Values.podAntiAffinity }}
          {{- if eq $pa.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
          {{- end }}
          {{- if eq $pa.type "required" }}
            - labelSelector:
                matchLabels:
                  app: {{ $name }}
              topologyKey: {{ $pa.topologyKey | default $globalPA.topologyKey }}
          {{- else }}
            - weight: {{ $pa.weight | default $globalPA.weight }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $name }}
                topologyKey: {{ $pa.topologyKey | default $globalPA.topologyKey }}
          {{- end }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ $name }}
        image: "{{ $.Values.image.repository }}/{{ $name }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: {{ $.Values.containerSecurity.readOnlyRootFilesystem }}
        ports:
        - name: http
          containerPort: {{ $svc.containerPort }}
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: {{ $name }}
        - name: ENVIRONMENT
          value: {{ $svc.environment | default "production" }}
        - name: SERVER_PORT
          value: {{ $svc.containerPort | quote }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ $.Values.infra.kafkaBootstrap }}
        - name: JAEGER_AGENT_HOST
          value: {{ $.Values.infra.jaegerAgentHost }}
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.existingSecret }}
              key: {{ $.Values.secrets.jwtSecretKey }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secrets.existingSecret }}
              key: {{ $.Values.secrets.postgresPasswordKey }}
        - name: REDIS_URL
          value: "redis://{{ $.Values.infra.redisHost }}:{{ $.Values.infra.redisPort }}/0"
        {{- if $svc.db }}
        - name: DATABASE_URL
          value: "postgresql+asyncpg://wildframe:$(POSTGRES_PASSWORD)@{{ $.Values.infra.postgresHost }}:{{ $.Values.infra.postgresPort }}/{{ $svc.db }}"
        {{- end }}
        {{- range $key, $val := $svc.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        {{- $sp := mergeOverwrite (deepCopy $.Values.probes.startupProbe) ((default dict $svc.probes).startupProbe | default dict) }}
        {{- $rp := mergeOverwrite (deepCopy $.Values.probes.readinessProbe) ((default dict $svc.probes).readinessProbe | default dict) }}
        {{- $lp := mergeOverwrite (deepCopy $.Values.probes.livenessProbe) ((default dict $svc.probes).livenessProbe | default dict) }}
        startupProbe:
          httpGet:
            path: {{ $sp.path }}
            port: http
          failureThreshold: {{ $sp.failureThreshold }}
          periodSeconds: {{ $sp.periodSeconds }}
          timeoutSeconds: {{ $sp.timeoutSeconds }}
        readinessProbe:
          httpGet:
            path: {{ $rp.path }}
            port: http
          initialDelaySeconds: {{ $rp.initialDelaySeconds }}
          periodSeconds: {{ $rp.periodSeconds }}
          timeoutSeconds: {{ $rp.timeoutSeconds }}
          failureThreshold: {{ $rp.failureThreshold }}
        livenessProbe:
          httpGet:
            path: {{ $lp.path }}
            port: http
          initialDelaySeconds: {{ $lp.initialDelaySeconds }}
          periodSeconds: {{ $lp.periodSeconds }}
          timeoutSeconds: {{ $lp.timeoutSeconds }}
          failureThreshold: {{ $lp.failureThreshold }}
        resources: {{- toYaml ($svc.resources | default $.Values.resources) | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
{{- end }}
