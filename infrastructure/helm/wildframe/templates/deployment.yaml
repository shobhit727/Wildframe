{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
    {{- include "wildframe.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ $name }}
        image: "{{ $.Values.image.repository }}/{{ $name }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ $svc.containerPort }}
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: {{ $name }}
        - name: ENVIRONMENT
          value: {{ $svc.environment | default "production" }}
        - name: SERVER_PORT
          value: {{ $svc.containerPort | quote }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ $.Values.infra.kafkaBootstrap }}
        - name: JAEGER_AGENT_HOST
          value: {{ $.Values.infra.jaegerAgentHost }}
        - name: JWT_SECRET_KEY
          value: {{ $.Values.secrets.jwtSecret }}
        - name: REDIS_URL
          value: "redis://{{ $.Values.infra.redisHost }}:{{ $.Values.infra.redisPort }}/0"
        {{- if $svc.db }}
        - name: DATABASE_URL
          value: "postgresql+asyncpg://wildframe:$(POSTGRES_PASSWORD)@{{ $.Values.infra.postgresHost }}:{{ $.Values.infra.postgresPort }}/{{ $svc.db }}"
        {{- end }}
        {{- range $key, $val := $svc.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        resources: {{- toYaml $.Values.resources | nindent 10 }}
{{- end }}
