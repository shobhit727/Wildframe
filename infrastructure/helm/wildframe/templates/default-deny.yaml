# Namespace-wide default-deny NetworkPolicy: every pod in the namespace
# starts with no ingress/egress traffic. Per-service policies
# (networkpolicy.yaml) add only the flows each workload requires.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wildframe.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
