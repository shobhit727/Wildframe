# PodDisruptionBudget for services with more than one replica, so node
# drains / voluntary disruptions cannot take a service fully offline.
{{- range $name, $svc := .Values.services }}
{{- $replicas := int ($svc.replicas | default $.Values.replicaCount) }}
{{- if gt $replicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-pdb
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
  minAvailable: {{ (default dict $svc.pdb).minAvailable | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
