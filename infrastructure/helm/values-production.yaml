# Production values: managed external data-plane required (issue #796).
# PostgreSQL: AWS RDS Aurora PostgreSQL (engine 15.6) via infrastructure/terraform/main.tf
#   - backupRetention 30d (minimum 7d enforced), PITR via continuous backups
#   - KMS encryption (aws_kms_key.rds), private subnets, no public access
#   - disaster recovery: cross-AZ replication (db_instance_count 2), point-in-time
#     restore, snapshot retention per terraform variables.tf
# Redis: AWS ElastiCache Redis 7.0 (multi-AZ, KMS encryption, slow-log CW)
#   - managed via aws_elasticache_replication_group, multi_az_enabled true
# In-chart postgres/redis is dev-only (deployments/docker-compose.dev.yml);
# production validation (templates/validate-external.yaml) fails closed if
# infra.postgresHost/redisHost is in-cluster or external.*.enabled is false
# or CIDRs/FQDNs are empty. Set infra.hosts to real RDS/ElastiCache endpoints
# and CIDRs/FQDNs to VPC ranges for NetworkPolicy egress.
namespace: wildframe-production

replicaCount: 2

image:
  repository: ghcr.io/shobhit727/wildframe
  pullPolicy: IfNotPresent

infra:
  postgresHost: "wildframe-prod.cluster-abc123xyz.us-east-1.rds.amazonaws.com"
  postgresPort: 5432
  redisHost: "wildframe-prod-001.abc123.cache.amazonaws.com"
  redisPort: 6379
  kafkaBootstrap: "kafka-prod:9092"

ingress:
  enabled: true
  host: app.wildframe.com

external:
  postgres:
    enabled: true
    cidrs: ["10.0.0.0/16"]
    fqdns: []
  redis:
    enabled: true
    cidrs: ["10.0.0.0/16"]
    fqdns: []

services:
  api-gateway:
    replicas: 3
    env:
      CORS_ALLOWED_ORIGINS: '["https://app.wildframe.com"]'
    pdb:
      minAvailable: 2
  auth-service:
    replicas: 2
    pdb:
      minAvailable: 1
    podAntiAffinity:
      type: required
  content-service:
    replicas: 2
    pdb:
      minAvailable: 1
    podAntiAffinity:
      type: required
  streaming-service:
    replicas: 2
    pdb:
      minAvailable: 1
    podAntiAffinity:
      type: required
  billing-service:
    replicas: 2
    pdb:
      minAvailable: 1
    podAntiAffinity:
      type: required

topologySpread:
  enabled: true
  maxSkew: 2
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
