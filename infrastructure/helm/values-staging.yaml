namespace: wildframe-staging

replicaCount: 1

image:
  repository: ghcr.io/shobhit727/wildframe
  pullPolicy: IfNotPresent

infra:
  postgresHost: "postgres-staging"
  redisHost: "redis-master-staging"
  kafkaBootstrap: "kafka-staging:9092"


ingress:
  enabled: true
  host: staging.wildframe.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

services:
  api-gateway:
    env:
      CORS_ALLOWED_ORIGINS: '["https://staging.wildframe.com"]'